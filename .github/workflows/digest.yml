name: 内容雷达日报

on:
  # 定时由 Cloudflare Worker（radar-capture）触发，见 worker/src/index.js 的 SCHEDULES。
  workflow_dispatch:
    inputs:
      dry_run:
        description: "试跑：只打印日报内容，不发消息"
        type: boolean
        default: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Asia/Shanghai
      XIAOK_APP_ID: ${{ secrets.XIAOK_APP_ID }}
      XIAOK_APP_SECRET: ${{ secrets.XIAOK_APP_SECRET }}
      RADAR_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 汇总当天入表内容，小K 私信
        run: python digest.py
