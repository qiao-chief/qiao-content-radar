name: 内容雷达

on:
  schedule:
    - cron: "40 1 * * *"   # 北京时间 09:40（得到大脑每天 08:00 更新博主前一天的视频）
    - cron: "40 5 * * *"   # 北京时间 13:40 补跑一次；重跑不会重复写表
  workflow_dispatch:
    inputs:
      dry_run:
        description: "试跑：只读数据，不写表、不发消息"
        type: boolean
        default: false
      window_days:
        description: "往回看几天的视频"
        type: string
        default: "3"

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Shanghai
      XIAOK_APP_ID: ${{ secrets.XIAOK_APP_ID }}
      XIAOK_APP_SECRET: ${{ secrets.XIAOK_APP_SECRET }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      GETNOTE_API_KEY: ${{ secrets.GETNOTE_API_KEY }}
      GETNOTE_CLIENT_ID: ${{ secrets.GETNOTE_CLIENT_ID }}
      RADAR_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
      RADAR_WINDOW_DAYS: ${{ inputs.window_days || '3' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装得到大脑命令行工具
        run: npm install -g @getnote/cli@1.5.10 && getnote version
      - name: 拉料、打标、写飞书表
        run: python radar.py
