name: 内容雷达

on:
  schedule:
    # GitHub 的定时任务会延迟几十分钟到几小时，也会在高峰期被直接丢掉（官方文档写明）。
    # 实测 9-23 排的三趟：一趟没触发、一趟晚 56 分钟、一趟晚 4 小时 45 分。
    # 对策就是多排几趟碰运气——重跑不会重复写表，一趟约 40 秒，每天合计 2 分钟，
    # 私有仓库每月 2000 分钟额度绰绰有余。早上密一点，保证乔帮主起床时表里有料。
    - cron: "13 1 * * *"   # 北京时间 09:13（得到大脑每天 08:00 更新博主前一天的视频）
    - cron: "51 1 * * *"   # 09:51
    - cron: "37 2 * * *"   # 10:37
    - cron: "23 4 * * *"   # 12:23
    - cron: "41 7 * * *"   # 15:41
    - cron: "19 10 * * *"  # 18:19
  workflow_dispatch:
    inputs:
      dry_run:
        description: "试跑：只读数据，不写表、不发消息"
        type: boolean
        default: false
      window_days:
        description: "往回看几天的视频"
        type: string
        default: "3"

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Shanghai
      XIAOK_APP_ID: ${{ secrets.XIAOK_APP_ID }}
      XIAOK_APP_SECRET: ${{ secrets.XIAOK_APP_SECRET }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      GETNOTE_API_KEY: ${{ secrets.GETNOTE_API_KEY }}
      GETNOTE_CLIENT_ID: ${{ secrets.GETNOTE_CLIENT_ID }}
      RADAR_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
      RADAR_WINDOW_DAYS: ${{ inputs.window_days || '3' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装得到大脑命令行工具
        run: npm install -g @getnote/cli@1.5.10 && getnote version
      - name: 拉料、打标、写飞书表
        run: python radar.py
