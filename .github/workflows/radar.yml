name: 内容雷达

on:
  # 定时由 Cloudflare Worker（radar-capture）触发，见 worker/src/index.js 的 SCHEDULES。
  # GitHub 自带的 schedule 不可靠（实测会丢、会晚几个小时），所以不在这里排定时。
  workflow_dispatch:
    inputs:
      dry_run:
        description: "试跑：只读数据，不写表、不发消息"
        type: boolean
        default: false
      window_days:
        description: "往回看几天的视频"
        type: string
        default: "3"

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # 提交发布步骤要 push docs/ 回仓库
    env:
      TZ: Asia/Shanghai
      XIAOK_APP_ID: ${{ secrets.XIAOK_APP_ID }}
      XIAOK_APP_SECRET: ${{ secrets.XIAOK_APP_SECRET }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      GETNOTE_API_KEY: ${{ secrets.GETNOTE_API_KEY }}
      GETNOTE_CLIENT_ID: ${{ secrets.GETNOTE_CLIENT_ID }}
      RADAR_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
      RADAR_WINDOW_DAYS: ${{ inputs.window_days || '3' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装得到大脑命令行工具
        run: npm install -g @getnote/cli@1.5.10 && getnote version
      - name: 拉料、打标、写飞书表
        run: python radar.py
      - name: 生成看板网页
        run: python build_site.py   # 输出到 docs/index.html + docs/CNAME；失败会非零退出让 CI 标红
      - name: 提交发布
        run: |
          git config user.name "内容雷达"
          git config user.email "noreply@github.com"
          git add docs
          git diff --cached --quiet && echo "网页没变化，不提交" && exit 0
          git commit -m "更新看板 $(date +%Y-%m-%d\ %H:%M)"
          git push
