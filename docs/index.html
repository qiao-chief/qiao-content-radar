<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>内容雷达 · 乔帮主选题看板</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
:root{
  --bg-page:#f7f1e4; --bg-card:#ffffff;
  --hero-bg:#3d2436; --hero-fg:#f7f1e4;
  --fg-0:#2a2020; --fg-1:#7a6f68;
  --accent:#8a2f3f;
  --chip-rose:#f0d8d2; --chip-sage:#d8e3d3; --chip-tan:#ece0c4; --chip-mauve:#e6dbe6;
  --radius:14px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg-page); color:var(--fg-0);
  font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px; line-height:1.7;
}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 80px}

/* hero */
.hero{
  background:var(--hero-bg); color:var(--hero-fg);
  border-radius:var(--radius); padding:28px 26px 24px;
  margin-bottom:18px;
}
.hero .kicker{font-size:12px;letter-spacing:2px;opacity:.65;margin-bottom:6px}
.hero .big{font-size:44px;font-weight:700;line-height:1.15}
.hero .big small{font-size:16px;font-weight:400;opacity:.75;margin-left:6px}
.hero .guide{margin-top:8px;font-size:13px;opacity:.8}
.hero .meta{margin-top:12px;font-size:12px;opacity:.55}

/* 四宫格：每张卡片直接跳转飞书对应的表 */
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.chip{
  display:block;
  border-radius:var(--radius); padding:14px 14px 12px;
  border:1px solid rgba(42,32,32,.06);
  transition:transform .12s ease, box-shadow .12s ease;
  color:var(--fg-0); text-decoration:none; user-select:none;
}
.chip:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(61,36,54,.10)}
.chip .n{font-size:26px;font-weight:700}
.chip .t{font-size:13px;margin-top:2px}
.chip.c-rose{background:var(--chip-rose)}
.chip.c-sage{background:var(--chip-sage)}
.chip.c-tan{background:var(--chip-tan)}
.chip.c-mauve{background:var(--chip-mauve)}

/* 工具条 */
.toolbar{
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  margin-bottom:16px;
}
.seg{display:flex;background:#efe6d3;border-radius:999px;padding:3px}
.seg button{
  border:none;background:transparent;padding:6px 16px;border-radius:999px;
  font-size:13px;color:var(--fg-1);cursor:pointer;font-family:inherit;
}
.seg button.on{background:var(--accent);color:#fff;font-weight:600}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.fbtn{
  border:1px solid #ddd0b8;background:transparent;color:var(--fg-1);
  padding:5px 12px;border-radius:999px;font-size:12.5px;cursor:pointer;font-family:inherit;
}
.fbtn.on{background:var(--fg-0);color:#f7f1e4;border-color:var(--fg-0)}
.search{
  border:1px solid #ddd0b8;background:#fff;border-radius:999px;
  padding:6px 14px;font-size:13px;font-family:inherit;min-width:140px;color:var(--fg-0);
}
.search:focus{outline:2px solid var(--accent);outline-offset:1px}

/* 内容卡 */
.card{
  background:var(--bg-card);border-radius:var(--radius);
  padding:20px 22px;margin-bottom:14px;
  border:1px solid rgba(42,32,32,.05);
}
.card .head{display:flex;align-items:flex-start;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.tag{
  display:inline-block;font-size:11.5px;font-weight:600;
  padding:2px 10px;border-radius:999px;flex-shrink:0;line-height:1.8;
}
.tag.strong{background:var(--accent);color:#fff}
.tag.rec{background:var(--chip-rose);color:var(--accent)}
.tag.adopted{background:var(--chip-sage);color:#3f5a3a}
.tag.pending{background:#eee6d6;color:var(--fg-1)}
.card h3{font-size:17px;font-weight:700;line-height:1.5;flex:1;min-width:200px}
.card .sub{font-size:12.5px;color:var(--fg-1);margin-bottom:10px}
.card .sub a{color:var(--fg-1)}
.card .recommend{
  font-weight:700;font-size:14.5px;margin-bottom:10px;
  padding-left:10px;border-left:3px solid var(--accent);
}
.card .summary{border-top:1px dashed #e4d9c2;padding-top:12px;font-size:14px}
.card .summary h1,.card .summary h2,.card .summary h3,.card .summary h4{
  font-size:14.5px;margin:14px 0 6px;color:var(--accent)}
.card .summary h1:first-child,.card .summary h2:first-child,.card .summary h3:first-child{margin-top:0}
.card .summary ul,.card .summary ol{padding-left:20px;margin:6px 0}
.card .summary p{margin:6px 0}
.card .summary strong{color:var(--fg-0)}
.card .link-btn{
  display:inline-block;margin-top:12px;margin-right:18px;font-size:13px;
  color:var(--accent);text-decoration:none;font-weight:600;
}
.card .link-btn:hover{text-decoration:underline}

/* 速记 */
.notes-list .note{
  background:var(--bg-card);border-radius:10px;padding:12px 16px;margin-bottom:8px;
  border:1px solid rgba(42,32,32,.05);font-size:14px;
}
.note .nt{font-size:12px;color:var(--fg-1);margin-top:4px}
.note a{color:var(--accent);word-break:break-all}

/* 速记输入 */
.capture{
  background:var(--bg-card);border-radius:var(--radius);padding:18px 20px;margin-bottom:22px;
  border:1px dashed #d8c9a8;
}
.capture .ct{font-size:13px;font-weight:700;margin-bottom:10px}
.capture .row{display:flex;gap:8px;flex-wrap:wrap}
.capture input{
  flex:1;min-width:180px;border:1px solid #ddd0b8;border-radius:10px;
  padding:9px 14px;font-size:14px;font-family:inherit;background:#fbf8f0;color:var(--fg-0);
}
.capture input:focus{outline:2px solid var(--accent);outline-offset:1px}
.capture button{
  background:var(--accent);color:#fff;border:none;border-radius:10px;
  padding:9px 22px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;
}
.capture button:disabled{opacity:.5;cursor:default}
.capture .hint{font-size:12px;color:var(--fg-1);margin-top:8px}
.capture .ok-msg{color:#3f5a3a;font-size:13px;margin-top:8px;display:none}
.capture .err-msg{color:var(--accent);font-size:13px;margin-top:8px;display:none}

.empty{padding:40px 0;text-align:center;color:var(--fg-1);font-size:14px}
.section-title{font-size:15px;font-weight:700;margin:26px 0 12px;display:flex;align-items:center;gap:8px}
.section-title::after{content:"";flex:1;height:1px;background:#e4d9c2}

@media (max-width:640px){
  .grid4{grid-template-columns:repeat(2,1fr)}
  .hero .big{font-size:34px}
  .wrap{padding:14px 12px 60px}
  .card{padding:16px}
}
</style>
</head>

e"}, {"level": "强烈推荐", "title": "为什么你用AI做的东西，大家都夸却没人用", "blogger": "清华姜学长", "recommend": "AI让做产品变容易，但没人验证真实需求，做出来只有夸赞没人用", "summary_md": "🤔 **AI时代产品供需反差现象**\n- AI普及后产品制作门槛大幅降低，构思产品的人数暴增，但实际使用产品的用户却大幅减少\n- 很多开发者用AI快速制作出小工具发布后，收获大量夸赞和求链接的评论，最终实际使用人数却寥寥无几\n\n💡 **核心原因一：制作端提前获得满足**\n- 借助AI生成方案、搭建界面，原本模糊的想法几十分钟就能落地运行，制作过程全程有正向反馈，开发者很容易获得成就感\n- 开发者沉浸在持续迭代功能、修改界面的推进感中，却始终没有去验证真实用户的实际需求\n- 和AI协作总能得到即时回应，反而让开发者下意识回避去现实中接受用户检验，避开可能碰壁的环节\n\n🙌 **核心原因二：用户的点赞不等于真实使用需求**\n- 用户的点赞认可的是AI产品演示的新鲜感，是为“AI能实现这种效果”的新奇体验买单，并非真的产生了使用该工具的需求\n- 开发者很容易误将演示内容获得的点赞，当成用户对自身工具的实际使用需求，产生认知偏差\n\n⏱️ **核心原因三：用户的使用成本并未降低**\n- AI缩短了开发者的开发时间，却没有自动缩短用户学习操作、导入资料、校验内容、调整使用习惯的时间\n- 即便工具免费，用户依然要投入大量时间精力，因此功能花哨的新工具往往比不过用户早已用习惯的普通老方法\n\n📢 **后续交流邀请**\n- 作者提及刚结束的第二期黑客松产出了十几个AI作品，邀请参与活动的成员回到姜学长的AI学习圈交流后续使用反馈\n- 所有正在用AI制作产品、遇到卡点的独立开发者，都可以加入圈子交流经验", "time": "2026-10-22 21:50", "link": "https://www.iesdouyin.com/share/video/7699489339399864805/", "adopted": false, "feishu_link": "https://vcnf6h45v8ij.feishu.cn/record/M9XhrRhCJenDfNc9DlvcZtsKnuc"}, {"level": "推荐", "title": "国内顶流博主相继出海英文区，普通人如何才能分一杯羹？", "blogger": "柱子哥TzFilm", "recommend": "国内内容内卷打磨后出海有质量优势，AI可解决语言与分发门槛", "summary_md": "📈 **博主出海核心动因**\n- 国内头部数码博主如影视飓风纷纷制作纯英文内容分发海外，其iPhone相关测评在Twitter获得超千万播放热度极高\n- 头部博主在国内平台发展趋近饱和，渴望破圈拓展海外受众\n- 国内数码科技区内容经过长期内卷打磨，剪辑节奏、内容质量对海外博主形成降维打击，海外多数创作者内容形式枯燥，多为对着镜头长时间讲解缺乏优质包装\n- 国内平台流量分发权掌握在平台手中，赛道流量易受平台策略影响出现下跌；海外平台流量自主权更多掌握在用户手中，优质内容破圈可能性更高\n\n🤖 **AI解决出海语言痛点实操方案**\n- 内容出海分为两类：中文内容直接分发海外商业价值极低，海外中文受众与国内受众高度重合无法拓展粉丝基数，且不同平台用户偏好差异大，因此头部博主均选择重新制作纯英文原生内容\n- 针对英文口播录制难题：初期使用开源项目Voice Studio的10多G本地免费语音模型生成音频，但效果被海外观众反馈音质差；后续更换为MiniMax语音模型生成更自然的英文语音\n- 针对内容本土化优化：可申请YouTube官方API对接AI工具，自动根据视频内容生成符合母语用户习惯的英文标题、封面、简介并添加相关标签，完成内容本土化修改\n\n🎬 **YouTube平台运营核心经验**\n- 账号基础设置：将账号所有信息全部修改为英文，切换至英文区完成基础搭建\n- 新号冷启动规则：新账号存在15-30天的平台熟悉冻结期，前10条视频大概率几乎无流量，需坚持稳定更新至少10条内容，半个月到一个月后复盘数据，单条视频能达到一两百次观看即代表账号已获得正常推流\n- 核心数据指标：封面点击率需达到10%以上才算达标，可借助GPT生成专业英文封面；观众深度观看时长是影响推流的关键因素；通过封面曝光次数判断平台是否正常推流，曝光量达数千次代表平台已正常分发，仅几十上百次则说明未进入正常推荐池；平台互动权重极高，新号初期无互动属于正常情况\n\n💡 **普通人出海思 false, "feishu_link": "https://vcnf6h45v8ij.feishu.cn/record/DdEArGshNeU9fFc6uDBcwoKlnnd"}, {"level": "推荐", "title": "做成小事问出真需求", "blogger": "姜胡说", "recommend": "先做成一件已验证需求的小事，再线下小范围收集真实付费需求。", "summary_md": "📌 **核心逻辑转变**\n- 前期起步阶段采用供给在前的方式，通过售卖闲置物品走通完整商业闭环，搭建基础商业认知的\"小桶\"\n- 完成初始闭环后切换为需求在前、供给在后的模式，从练手转向精准挖掘真实付费需求\n\n✅ **第一步：做成一件高价值小事**\n- 挑选多数人想做但不知道怎么做的小事，比如拍出短视频爆款、靠写作月增收五千、用AI搭建出可用知识库\n- 这件事本身已验证供需，已有用户愿意为相关成果付费\n- AI普及后知识获取成本大幅降低，用户购买的核心不是知识，而是\"确定性\"，把不确定的事做成确定的事，就能获得付费基础\n\n🤝 **第二步：线下小范围收集真需求**\n- 举办免费的小范围分享，分享自己做成这件小事的实操经验\n- 为分享设置门槛：需要申请、提交相关内容、付出时间成本，筛选出真正有需求的用户\n- 小范围场景下用户会提出真实问题，比如门店短视频怎么做、账号怎么定位等，这些就是真实付费需求\n- 为用户提供针对性方案，让用户实操后反馈，迭代优化方案\n- 无需急于收费，通过门槛筛选避免白嫖，免费分享没有义务回答所有问题，自然筛选出愿意付费的用户\n\n✂️ **第三步：切片化输出建立信任**\n- 将验证过的需求和对应方案拆分切片，一次只解决一个具体问题\n- 把切片内容做成短视频等形式，相当于产品的\"试用装\"，类似软件免费试用、面包店试吃的逻辑，先让用户体验价值建立信任\n- 付费用户提出的才是真正的核心需求，免费用户的提问往往随意、不落地\n- 基于付费用户的真实反馈持续迭代产品，逐步扩大用户规模\n\n📊 **核心收入公式**\n- 收入=利润×用户数×复购\n- 利润本质是你为用户提供的实际价值\n- 用户数来自切片试用装带来的信任积累\n- 复购依靠持续输出真实价值、不欺骗用户来实现", "time": "2026-10-15 20:03", "link": "https://www.iesdouyin.com/share/video/7696863901643836687/", "adopted": false, "feishu_link": "https://vcnf6h45v8ij.feishu.cn/record/UnylrYGH7eObm4cAWfXcQmB2nvg"}, {"level": "推荐", "title": "从一件闲置，跑通赚钱闭环", "blogger": "姜胡说", "recommend": "从家中闲置电子产品起步，走通供需闭环，建立能接住机会的桶。", "summary_md": "💡 **核心认知卡点**\n- 多数人从小掌握的是知识性能力：学习、理解、考试拿分，即便实践也难赚到钱\n- 真正缺失的是结构性能力：如同将零散乐高积木拼成擎天柱才能卖出艺术品溢价，而非仅售卖低价积木零件\n- 多数人如同螺丝钉，仅靠售卖技能、时间获取低收入，无法产生溢价\n- 机会一直存在，互联网、自媒体、外贸等风口不断，多数人却没有能接住机会的“桶”，甚至桶是漏的\n\n🛒 **闲置物品实操起步法**\n- 从家中闲置物品切入，经济底层是供需，当初购买闲置就证明它存在需求，当下你不需要不代表他人不需要\n- 优先从电子产品类闲置开始实操，旧电脑即便价值降低仍有使用价值\n- 触达用户的关键细节：不要仅把商品摆上二手市场，参考Airbnb早期经验，房东拍摄的房源照片过于粗糙导致无人租住，优化照片拍摄、打磨文案后房源快速租出\n- 二手商品运营要点：认真拍摄商品照片，将瑕疵清晰展示，如实说明当初购买用途、闲置原因，明确标注商品适用场景与使用方法，参考同类商品定价后上架\n- 核心目的并非靠闲置赚钱，而是完整走通一次赚钱闭环，打造出第一个能接住机会的“小桶”\n\n📈 **闭环进阶方法**\n- 不要仅售卖一次闲置，坚持完成5次售卖，单次成交可能是运气，完成5次就能真正掌握实操方法\n- 理解PMF（产品与市场匹配）逻辑，没人能精准预判匹配度，要用极低的成本试错，不断调整优化，最终找到适配的好品\n- 供给端升级：尝试售卖虚拟产品，大幅降低成本\n- 触达端升级：跳出二手市场，拓展线下活动、招标会、短视频公域转私域等多元渠道\n- 交易模式升级：优化商业模式 www.iesdouyin.com/share/video/7694923449948491046/", "adopted": false, "feishu_link": "https://vcnf6h45v8ij.feishu.cn/record/KK4Rr9GsOeveEicXDjEcBdLJnvh"}, {"level": "强烈推荐", "title": "别让AI瞎扮演！2招提升和AI沟通效率", "blogger": "FredTalk", "recommend": "先告知AI自身背景需求，再让AI推荐带公开观点来源的专家并列出角度优劣势", "summary_md": "💡 **传统AI人设提示的痛点**\n- 仅给AI设定专家角色却不告知自身背景需求，最终得到的建议往往空泛无针对性\n- 类比去医院看专家号却不说明自身病症，医生只能盲目猜测给出通用内容\n\n🔍 **方法一：让AI帮你匹配对应专家**\n- 适用场景：不清楚自身需求该对接什么领域专家时使用\n- 操作步骤：第一步告知AI自身的背景和具体需求，第二步要求AI基于需求推荐3位真实具体、带有公开观点来源的专家，同时说明每位专家分析问题的角度及该角度的优劣势并整理成表格，第三步从推荐结果中选定一位专家开展后续任务\n- 实操示例：想要将free talk语音工具做成iOS移动端项目，使用该方法可得到精准的专家选项，后续开发效率大幅提升\n- 配套支持：该方法已总结为专属skill，相关资料已整理到fre专属知识库\n\n📝 **方法二：主动告知自身完整背景**\n- 适用场景：已经明确自身情况和基础条件时使用\n- 实操示例：有100多期AI教程制作经验、日常用code产出内容，想要补AIGC基础且先从制作小片入手，告知AI这些背景后，得到的学习建议会具备明确的针对性和可落地性\n\n✨ **核心总结**\n- 提升AI沟通效率的关键核心是清晰告知AI你是谁、你想做什么、你的具体需求和背景信息，再让AI匹配合适的角色开展后续任务\n- 本期内容全部通过skill和组件库自动输出，分享者为Fred，主打从0到1教授AI和vibecoding相关知识", "time": "2026-10-10 10:56", "link": "https://www.iesdouyin.com/share/video/7694867710575988008/", "adopted": false, "feishu_link": "https://vcnf6h45v8ij.feishu.cn/record/KwYlrwHu3eoBzYcwQ28cPLl3nzg"}, {"level": "推荐", "title": "RSI是什么？AI真能自己进化吗？", "blogger": "清华姜学长", "recommend": "RSI指AI参与自身升级，能自行检查、改进、实验并保留优化点，区别于传统人工迭代。", "summary_md": "🤖 **RSI核心定义**\n- RSI即递归式自我改进，指AI参与自身升级流程，自行检查问题、提出改进方案、开展实验并留存有效优化点\n- 区别于传统由研究人员主导迭代的AI升级模式，RSI的核心逻辑是让改进后的AI版本继续参与自身的下一轮优化\n- 典型场景：AI原本会在无前景的研究方案上浪费时间，修改自身工作方式后可更早判定方案不可行，转向其他路径，后续新版本还能继续挖掘可优化的空间\n\n✨ **RSI的核心吸引力**\n- AI自身的能力在提升的同时，推动能力提升的方法体系也会同步进步\n- 类似学生发现自身高频出错的问题后调整学习方法，新方法既提升学习效果，也能更高效地找到后续可优化的方向\n\n🔬 **现有相关实验进展**\n- 目前已有相关实验开展，名为AID的实验让AI修改研究助手的代码，留存表现更优的新版本持续迭代\n- 实验连续运行8天，累计完成7次有效改进，优化方向集中在方案搜索方式、海量信息管理逻辑，未对底层大模型进行重新训练\n- 验证了AI可以从修改自身工具和工作流程起步，实现初步的自我改进\n\n⚠️ **RSI发展的关键难点**\n- 仅迭代出数个更优版本，不代表后续可以持续迭代，更不代表会自动进入越改越快的状态\n- 后续可优化的问题会越来越难挖掘，容易解决的显性问题被处理后，剩余问题需要投入更多实验才能找到突破口\n- 效果验证难度高：AI修改代码后测试分数提升，可能是方法真的优化，也可能只是适配当前测试集，更换任务后反而性能退步，错误的修改留存会让后续迭代走向错误方向\n- 目前AID实验尚未明确验证：改进后的研究助手，比初始版本更擅长开展下一轮的自我改进\n\n📌 **RSI与智能爆炸的区别** ense）**\n- 核心是精准理解用户真正需要解决的底层问题，而非停留在表面需求\n- 以搭建帮助团队新人查资料的AI助手为例：仅接入文档提升回答速度和完整度远远不够，新人实际的痛点是无法判断资料版本是否有效、遇到特殊情况不知道找谁确认\n- 明确用户真实需求后，优先解决“让用户看懂依据、确认版本、找到负责人”远比单纯增加答案长度更有价值\n- 积累的用户需求理解经验可以复用至后续同类项目，帮助快速定位表面需求背后的核心问题，等AI模型能力升级后，过去受技术限制无法落地的需求也能顺利实现，更快找到新模型的应用方向\n\n🔍 **第二种能力：判断力（Judgment）**\n- 核心是明确什么结果符合要求，哪些错误绝对不能接受\n- 仍以AI助手为例：不能仅以回答流畅作为交付标准，需要明确判断规则，比如识别引用过期规定、多份文件内容矛盾等问题，还要设置不确定时主动提醒用户的机制\n- 实际试用后会发现用户可以接受回答多等待几秒，但引用过期规定导致后续决策出错是不可接受的，因此需要调整验收标准\n- 每处理一次问题都会积累新的判断依据，更换新模型后可以用过往遇到的问题重新评估模型能力，明确其进步点和仍需人工核验的环节\n- AI模型越强，生成方案的成本越低、可选方案越多，过往积累的判断标准能帮助快速筛选有效结果、规避问题，让更多尝试转化为实际有效成果\n\n🚀 **第三种能力：主动推进落地的能力（Agents）**\n- 核心是主动推动方案从想法落地到拿到实际结果\n- 方案成型后还有大量后续工作需要推进：确定AI助手的试用人员、资料更新负责人、错误处理机制，引导团队新人调整原有工作习惯等，都需要主动发现问题、协调资源、持续优化\n- 每完成一个项目，会更清晰地掌握项目落地的规律：明确哪些人员需要提前参与、哪些环节容易出现阻碍、哪些问题必须优先解决\n- 稳定交付的过程中会逐步建立合作信任，这些经验和信任会大幅降低下一次推进项目的难度\n- 当AI模型可以承担更多代码编写、资料整理、原型制作工作后，个人的任务边界会大幅拓宽，过去受人手和时间限制无法推进的项目也有机会落地，越懂如何组织工作，就越能把AI的新增能力转化为实际产出\n\n📈 **第四种能力：从结果中学习的能力（Learning）**\n- 这项能力决定了前面三种能力能否持续积累复利\n- 以AI助手上线后的反馈为例：原本以为把常规流程说明白就足够，实际发现新人反复追问的都是例外情况，仅补充单条答案的价值非常有限\n- 如果能基于这次反馈调整工作方法，后续了解需求时主动询问例外场景、验收环节增加相关检查项、启动项目前提前邀请对应负责人参与，就能让这次经验优化后续行动，真正实现学习的复利\n- AI模型变强会降低尝试和修改的成本，相同时间内可以尝试更多方案、获取更多反馈，能根据反馈及时修正判断的人，能力积累速度会远超他人\n- 完成每个AI项目后，除了工作流之外，更值得留存的是用户真实遇到的问题、方案失败的原因，以及据此调整的判断标准和行动方法，更换新模型后可以带着这些积累重新尝试落地\n\n🔗 **四种能力的协同价值**\n- 产品感帮助找到值得解决的核心问题，判断力帮助识别有效的输出结果，主动推进能力帮助方案顺利落地，从结果中学习的能力把实际成果转化为下一次行动的经验\n- 四种能力相互配合，过往的投入会持续优化未来的表现，AI模型每升级一步，都能依托已有的积累完成更复杂的任务，这就是值得长期投入的核心竞争力", "time": "2026-10-08 23:03", "link": "https://www.iesdouyin.com/share/video/7694312925079022949/", "adopted": false, "feishu_link": "https://vcnf6h45v8ij.feishu.cn/record/GOfhr6GSQeCa4tcX4pkctw4Unag"}, {"level": "推荐", "title": "为什么越学越穷", "blogger": "姜胡说", "recommend": "能调用的知识才是资产，只学最少关键知识并嵌入实际工作流", "summary_md": "💡 **核心认知误区**\n- 很多人误把\"接触\"当成\"拥有\"，加了一堆大佬微信却无法建立有效可调用的关系\n- 学习知识时只停留在眼熟、记笔记的层面，真到用时大脑一片空白，这些知识本质上还是别人的，无法被自己调用\n- 能调用的关系才是真关系，能调用的知识才是真资产\n\n📝 **实操五步法**\n- 第一步：只学最少、关键、用于判断的知识，当下时代琐碎细节反而是噪音，会干扰判断，核心知识一页纸就能梳理清楚，抓住关键点和它们之间的连 作的时间越久，和真实世界的脱节就越严重\n- 内容创作的核心是选题而非技巧，内容是否切中用户痛点、是否是大众真正关心的话题才是关键\n- 共创产出的内容属于所有参与者，用户会主动帮忙传播，自带共鸣属性", "time": "2026-10-05 20:57", "link": "https://www.iesdouyin.com/share/video/7693167131781261267/", "adopted": false, "feishu_link": "https://vcnf6h45v8ij.feishu.cn/record/UiuAr5vCveFROKcDLLBcmnlDnob"}, {"level": "推荐", "title": "如何做出高质感作品", "blogger": "清华姜学长", "recommend": "解决AI生成页面模板感重的三步法：多看优质设计、用具体设计语言描述、引导AI按方向迭代。", "summary_md": "🎨 **核心痛点解决思路**\n- 用AI生成代码页面难度不高，但容易出现模板感过重的问题\n- 布局、字体、配色看似齐全但整体缺乏质感\n- 改善方向分为三步：多看优质设计、清晰描述设计语言、引导AI按方向迭代修改\n\n🌐 **推荐设计案例网站**\n- 网站内收录大量品牌设计案例\n- 浏览案例不能仅停留在“好看”的表层，要深度拆解细节\n- 拆解维度包含配色舒适的原因、标题字体特点、页面留白占比、图文搭配逻辑\n- 具体的描述指令能大幅提升AI生成的精准度，例如指定“黑白主色搭配单一强调色、特色衬线字体作为标题、减少卡片元素增加留白”，效果远好于模糊的“做的高级一点”\n\n🛠️ **高星GitHub Skill工具**\n- 第一个Skill在GitHub拥有近9万颗星，属于设计方向工具箱\n- 只需告知工具页面用途、目标受众、想要传递的视觉感受，它会自动梳理信息并输出适配的设计处理方案\n- 仓库内除通用设计能力外，还包含旧项目改造、不同视觉风格适配的专项Skill\n- 第二个Skill在GitHub拥有7万多颗星，核心作用是帮助用户把修改需求具象化\n- 可针对性解决排版不适、页面冗余、视觉平淡等常见问题，对应调整字体层级、做页面减法、强化视觉表现\n\n📝 **完整落地流程**\n- 第一步通过设计案例网站拆解喜爱的设计，提炼出数条具体可落地的设计要求\n- 第二步使用高星设计Skill梳理整体设计方向\n- 第三步借助具象化调整Skill根据页面实际效果逐步迭代优化\n- 工具仅能提供方向辅助，审美能力提升仍需要长期多看、多做、多交流\n\n👥 **配套学习社群**\n- 姜学长的AI学习圈会不定期组织黑客松活动与实践打卡\n- 社群内已有不少学员产出兼具创意与高审美的优质作品\n- 后续还会推出系统练习高质感作品的相关实践活动，欢迎爱好者加入交流", "time": "2026-10-05 19:44", "link": "https://www.iesdouyin.com/share/video/7693148311179811185/", "adopted": false, "feishu_link": "https://vcnf6h45v8ij.feishu.cn/record/Sgevrz6jqeE5zjcMHzlcLsbbn3c"}, {"level": "推荐", "title": "先干成一件小事", "blogger": "姜胡说", "recommend": "一人公司起步要让价值被看到，渠道不限于自媒体，还包括讲课、线下活动、写文章等对外展示动作。", "summary_md": "💡 **核心底层逻辑**\n- 一人公司起步的核心要义是让你的价值被别人看到\n- 成功结果由「价值」和「被看到」两个变量相乘得出，二者缺一不可\n- 没人知晓你的存在，即便自身价值再高也无法转化为实际成果，印证了酒香也怕巷子深的道理\n\n👀 **「被看到」的多元渠道**\n- 渠道不局限于做自媒体，还包含拍短视频、写文章、公开演讲、出席社群活动、举办线下活动等多种形式\n- 分享者自身在做自媒体之前，长期从事咨询行业，坚持外出讲课、举办多年线下活动、持续输出文章\n- 很多人的核心卡点是完全不尝试任何对外展示的动作，始终迈不出第一步\n\n✨ **「价值」的落地路径**\n- 拥有大厂高管、知名创业经历这类高光背景的人自带关注度，但这类成就普通人很难达成\n- 若暂时没有亮眼履历，最可行的方式是先干成一件小事\n- 小事的优势在于试错成本低，哪怕是一场AA制的小型线下活动，都要经历找场地、谈价、预估人数、管理报名等诸多细节调整，大事的复杂程度只会更高\n- 做成一件小事可以同时证明两件事：这件事的成果是真实可落地的，你自身具备对应的执行价值\n\n🎯 **高适配小事的两个方向**\n- 讨巧方向：直接将「让别人看到」本身作为要完成的小事，比如拍短视频、写文章、做公开演讲、组织线下活动，动作本身就是对外展示的过程\n- 刚需方向：一是教人赚钱，当下大众普遍有赚钱需求但缺乏可行方法，前提是自身真的能赚到钱且方法可复制，绝非忽悠他人；二是活出自我，当下很多人情绪被忽视、活得压抑，若你能活得洒脱有生命力，自然会吸引他人关注\n- 两个方向可以做交集，比如举办「活出自我」主题的线下社群活动\n\n🚀 **关键执行步骤**\n- 做这件小事的全程就要对外公开，而非等完全做完之后再展示\n- 边做边公开能让观看者拥有在场感和参与感，内容更具真实性，能强化用户粘性，形成养成系的陪伴感\n- 先做成一件小事让一部分人看到，再完成下一件小事触达更多人、建立更多连接，在此基础上逐步放大规模，价值被看见的过程中商业模式会自然成型\n- 当下就可以立刻行动：挑选手头正在做的一件小事，公开记录第一条内容，比如发布一条短视频、一篇笔记，不用等事情全部做完再展示", "time": "2026-10-04 22:32", "link": "https://www.iesdouyin.com/share/video/7692820343819455785/", "adopted": false, "feishu_link": "https://vcnf6h45v8ij.feishu.cn/record/NMVArwOyZep9rrcqQxncYcyHnre"}, {"level": "推荐", "title": "成为AI工程师必须的基本技能", "blogger": "清华姜学长", "recommend": "AI工程师核心是把概率性模型做成稳定系统，AI写代码普及后定义问题、设计系统、判断决策最难被替代。", "summary_md": "🎯 **AI工程师的核心定位**\n- AI工程师的核心能力是将存在概率性失误的模型，打造成用户可信任、能及时发现并处理问题的稳定系统\n- 本质是把模型的概率能力转化为可稳定交付的工程能力\n- AI辅助写代码普及后，工程重心从\"如何写出代码\"转移到\"如何证明代码是正确的\"，单纯写代码的能力会被稀释，定义问题、设计系统和判断决策的能力最难被替代\n\n📚 **打破传统技能清单式学习误区**\n- 不建议按部就班先花半年学完Python所有知识点再做项目，可借助AI辅助快速上手\n- 用三个核心问题判断能力掌握程度：能不能跑起来、能不能让它稳定完成、它是不是真正有用\n- 高效学习方式是找到成熟开源项目，看懂、运行、修改并转化为自己的内容，在实践中补全缺失的知识点\n\n🔧 **第一层能力：让项目成功跑起来**\n- 需掌握基础Python、Git命令行、Linux、API相关基础能力\n- 要具备看懂项目结构、定位代码修改位置、排查报错、使用Git保存回退版本、理清数据流向、保护API密钥和用户数据的能力\n- 明确AI可辅助写代码，但使用者要承担代码运行的全部后果\n\n⚙️ **第二层能力：让系统稳定完成任务**\n- 核心围绕三个关键词展开：上下文、行动、评估\n- 上下文工程：RAG只是其中一种实现方式，要判断模型完成任务所需的信息来源，合理筛选信息，避免冗余内容干扰模型，明确上下文是有限资源，追求用最少的高质量信息保障模型正确输出\n- 行动能力：合理选择Workflow和Agent，仅当任务路径无法提前固定时使用Agent，优先采用简单可组合易调试的模式，通过Harness明确模型的工作环境、可用工具、边界规则和失败恢复机制\n- 评估能力：是多数AI教程缺失的关键部分，不能仅靠主观感受判断效果，从真实失败案例中整理二三十个任务即可搭建第一版评测集，通过评测验证版本迭代效果，避免系统出现隐性退化\n\n🚀 **第三层能力：让产品真正落地可用**\n- 需应对真实世界的各类突发状况：异常用户输入、API超时、数据错误、成本超支等\n- 要掌握日志与链路追踪、超时重试、权限与数据安全、成本与延迟控制、失败回退等工程能力\n- 不建议初学者过早啃复杂的集群类技术，优先将产品交付给真实用户，通过用户反馈校准产品，用失败日志定位问题，用评测集沉淀经验，打造可自我进化的AI系统\n\n📋 **三步实战学习路线**\n- 第一个项目：制作个人日常使用的简易AI工具，覆盖真实API调用、结构化输出、异常处理和Git版本管理，达成\"跑起来\"的目标\n- 第二个项目：搭建接入外部数据的项目，可选用RAG、数据库或搜索工具，配套至少二三十个真实问题搭建基 步从零到真正会用", "blogger": "清华姜学长", "recommend": "非技术人学AI四步法：建立能力地图、清晰交代任务、动手实践、复盘迭代。", "summary_md": "🧠 **第一步：建立AI认知地图**\n- 无需先研究技术原理，先理解AI的三种核心能力：语言能力（梳理材料、改文案）、多模态能力（处理图像/音频/视频）、工具调用能力（读文件、执行操作）\n- 了解基础AI概念（大模型LM、智能体Agent、上下文Context），遇到时再补学，无需提前背诵\n- 判断标准：手上的任务能大致对应AI工具，如整理会议记录直接找文件处理工具，无需先学部署Agent\n\n📝 **第二步：学会清晰交代任务**\n- 练习一次对话明确需求，避免模糊指令（如写周报需说明材料、对象、字数、重点）\n- 提供具体要求（如“200字发给主管的周报，重点讲项目进展/问题/计划，不编数据”）\n- 拿到结果后指出具体问题（如“未完成事项不能写交付，改成‘目前进展’”），而非笼统说“重写”\n\n💻 **第三步：用AI完成真实工作**\n- 拿本周实际任务练习（如整理会议纪要：上传脱敏记录，让AI提炼结论、责任人和跟进时间，标注重难点）\n- 检查结果：对照原记录确认是否遗漏关键事项，是否将讨论想法写成确定结论\n- 处理文件可尝试Cloud Code、CodedX等Agent工具，国内可了解Work Body，先拿副本试分类方案\n- 手机端可尝试小龙虾、OpenC Hermes等工具，配置后通过聊天软件安排任务（需部署维护）\n- 整理任务要求为Skill（保存规则、模板、脚本），下次调用无需重复交代\n\n🛠️ **第四步：实战小项目（进阶）**\n- 做小工具/网站（如个人作品网站），先缩小范围（仅展示作品，不先加登录支付）\n- 明确需求：告知网站受众、内容、风格，让AI列方案后做第一版\n- 测试优化：检查作品信息、按钮功能、手机适配，发现问题提供具体操作/错误信息\n- 公开使用需确认访问方式，检查是否泄露隐私\n- 边做边补必要知识，无需先学全编程，以“他人能否顺利使用”为验收标准", "time": "2026-09-21 19:05", "link": "https://www.iesdouyin.com/share/video/7687942973116735729/", "adopted": false, "feishu_link": "https://vcnf6h45v8ij.feishu.cn/record/DNLDrEqFCeaGpock8W2cfZfBnFh"}, {"level": "推荐", "title": "AI来了开发者变多了挣钱机会呢？", "blogger": "晓辉博士", "recommend": "AI降低开发门槛后，非技术者如何抓住长尾需求做小产品变现。", "summary_md": "🤔 **核心讨论背景**\n- 近期一张引发讨论的图：AI到来前独立开发者少、付费用户多；AI后开发者激增、付费用户看似不足\n- 大众初看觉得有道理，但需从多视角分析挣钱机会是否真的减少\n\n💡 **AI提升开发者交付能力**\n- 传统独立开发者交付能力有限，仅能做C端小功能\n- AI放大能力后，可开发复杂软件或To B服务，付费用户层次扩展\n\n🔍 **新需求与长尾市场**\n- AI让无开发能力者成为builder，满足未被关注的长尾需求（如情绪价值、陪伴、宗教类需求）\n- 企业转型/AI应用需求增加，小团队/独立开发者可承接To B交付\n\n💼 **多元化变现渠道**\n- Build in public模式带来咨询/卖课需求（用户希望学习开发方法）\n- 高流量开发者可通过广告商单变现\n- 变现方式从单一产品拓展至课程、广告、To B服务等\n\n🌱 **新需求增长点**\n- 独立开发者自身需求（公司注册、代理记账、法务合规等）\n- 关键：关注执行能力转移后不可替代的人类需求方向\n\n📅 **直播预告**\n- 周一晚上在新可能实验室视频号有公开直播\n- 分享做新可能实验室的想法及近期思考总结", "time": "2026-09-21 00:25", "link": "https://www.iesdouyin.com/share/video/7687654404861889657/", "adopted": false, "feishu_link": "https://vcnf6h45v8ij.feishu.cn/record/NXFTr8a8XelnQ6cUQyzcD7z9nqh"}, {"level": "推荐", "title": "动手吧， ": "姜胡说", "recommend": "人生地图误区与哑铃策略，讲非技术者不辞职用AI做副业转型。", "summary_md": "📜 **人生地图的误区**\n- 大多数人迷茫的根源是从小接受的“老师/家长绘制的地图”（好好学习→考大学→找好工作=人生美好）与真实世界不符\n- 按老地图走的人易陷入困境：老板学历低却成功，自己名校毕业仍不美满，情感和韧性脆弱\n- 改不动的三大原因：沉没成本过高、习惯难以改变、习得性无助（不知往哪改）\n- 盲目报班找老师易踩坑：活明白的人少，如同在水里抓空稻草\n\n🏋️ **哑铃策略：不辞职的转型方法**\n- 核心：70%精力留在原事业，30%投入符合三个条件的事\n- 三个条件：非对称收益（投入少产出高，非多拿工资的兼职）、试错成本极低、最好是新生事物（如AI）\n- 警示：不要轻易辞职，辞职后难重新开始；AI是当前推荐的新生事物，建议各行业都要使用\n\n🎯 **误差学习：校准地图的关键**\n- 核心：通过发现“理解的世界与真实世界的误差”来校准人生地图\n- 反馈周期要短：以年为单位三年仅3次调整机会，以天为单位三年有1000次\n- 新手建议：若无法承受日反馈，可先以周为单位；越早校准，沉没成本越少\n- 误区：不要追求完美主义、害怕犯错，最好的学习不是跟老师学，而是利用误差校准\n\n🔄 **可迁移的小事：积累进化的基础**\n- 多数人是“螺丝钉”，未接触真实市场闭环，仅追求老板认可（如《天道》所言：找别人替自己做主）\n- 判断小事的四问：①给谁提供价值？②如何实现？③能否获得反馈（谁的反馈？什么样的反馈？）④有无改进空间\n- 关键：小事需有积累和进化空间，避免“今天做完扔了明天从零开始”的无积累行为", "time": "2026-09-19 22:36", "link": "https://www.iesdouyin.com/share/video/7687255331713371392/", "adopted": false, "feishu_link": "https://vcnf6h45v8ij.feishu.cn/record/GteXr3e60eOy1ScV1xEczyuknIn"}, {"level": "推荐", "title": "AI什么时候才算一个真正的队友？。这次在华为全联接大会讲完《从工具到队友》，我脑子里一直留着一个很具体的问题：", "blogger": "清华姜学长", "recommend": "从工具到队友，讲管理者怎么把AI从助手变成团队协作成员。", "summary_md": "（得到大脑没转写出来，只有标题）", "time": "2026-09-19 21:11", "link": "https://www.iesdouyin.com/share/video/7687233278801153334/", "adopted": false, "feishu_link": "https://vcnf6h45v8ij.feishu.cn/record/Xfj9rrU1xe5XCUcdpZxcmmWKnQi"}, {"level": "推荐", "title": "抖音创作者大会会后分享：想吃互联网这碗饭？顺应这几个趋势就行", "blogger": "柱子哥TzFilm", "recommend": "抖音AI垂类趋势解读，帮内容创作者判断该做应用还是AIGC方向。", "summary_md": "📈 **平台扶持方向**\n- 抖音持续扶持优质新人创作者，优质内容（知识型）可获得专属推荐通道与额外流量\n- 知识型内容涵盖AI、健身、厨艺、美妆、穿搭等领域，只要有干货即被判定为优质\n- 平台将提升创作者服务，通过品牌方资源对接帮助解决变现与流量杠杆问题\n- 创作者只需专注内容，平台会兜底商务合作、影响力扩展等环节\n\n🤖 **AI垂类发展趋势**\n- 抖音AI创作者已达4.4万，赛道竞争激烈\n- AI内容风口迭代：从早期\"沾AI即火\"→教程类→当前需转向应用场景与AIGC\n- 未来AI爆点方向：AI应用（降本增效/变现）与AIGC（平台重点扶持领域）\n- 需避免同质化内容，建议结合自身领域（摄影/外贸/外语等）与AI融合打造独特性\n\n🔒 **原创保护机制**\n- 抖音将加强原创保护，打击洗稿抄袭行为\n- 创作者可通过结合个人经验与AI技术建立竞争壁垒", "time": "2026-09-19 20:31", "link": "https://www.iesdouyin.com/share/video/7687223099644742975/", "adopted": false, "f const state = { src: 'sub', level: 'all', status: 'all', q: '' };
const listEl = document.getElementById('list');
const notesEl = document.getElementById('notes-list');

function escHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function mdRender(md){
  if (!md) return '';
  if (window.marked) {
    return marked.parse(md, { breaks: true });
  }
  return '<p>' + escHtml(md).replace(/\n/g, '<br>') + '</p>';
}

function subCard(r){
  const tagCls = r.level === '强烈推荐' ? 'strong' : 'rec';
  const adoptedTag = r.adopted ? '<span class="tag adopted">已采用</span>' : '';
  return `<div class="card">
    <div class="head"><span class="tag ${tagCls}">${escHtml(r.level)}</span>${adoptedTag}<h3>${escHtml(r.title)}</h3></div>
    <div class="sub">${escHtml(r.blogger)} · ${escHtml(r.time)}</div>
    ${r.recommend ? `<div class="recommend">${escHtml(r.recommend)}</div>` : ''}
    <div class="summary">${mdRender(r.summary_md)}</div>
    ${r.link ? `<a class="link-btn" href="${escHtml(r.link)}" target="_blank" rel="noopener">看原视频 →</a>` : ''}
    ${r.feishu_link ? `<a class="link-btn" href="${escHtml(r.feishu_link)}" target="_blank" rel="noopener">在飞书打开 →</a>` : ''}
  </div>`;
}

function hotCard(r){
  const tagCls = r.status === '已采用' ? 'adopted' : 'pending';
  return `<div class="card">
    <div class="head"><span class="tag ${tagCls}">${escHtml(r.status)}</span><h3>${escHtml(r.topic)}</h3></div>
    <div class="sub">${escHtml(r.source)} · ${escHtml(r.time)}${r.reason ? ' · ' + escHtml(r.reason) : ''}</div>
    ${r.core ? `<div class="recommend">${escHtml(r.core)}</div>` : ''}
    ${r.angle ? `<div class="summary"><p><strong>切入角度：</strong>${escHtml(r.angle)}</p></div>` : ''}
    ${r.link ? `<a class="link-btn" href="${escHtml(r.link)}" target="_blank" rel="noopener">看原文 →</a>` : ''}
    ${r.feishu_link ? `<a class="link-btn" href="${escHtml(r.feishu_link)}" target="_blank" rel="noopener">在飞书打开 →</a>` : ''}
  </div>`;
}

function render(){
  let html = '';
  if (state.src === 'sub'){
    const q = state.q.toLowerCase();
    const rows = DATA.sub.filter(r =>
      (state.level === 'all' || r.level === state.level) &&
      (!q || (r.title + ' ' + r.blogger).toLowerCase().includes(q))
    );
    html = rows.map(subCard).join('') || '<div class="empty">没有符合条件的条目</div>';
  } else {
    const q = state.q.toLowerCase();
    const rows = DATA.hot.filter(r =>
      (state.status === 'all' || r.status === state.status) &&
      (!q || (r.topic + ' ' + r.source).toLowerCase().includes(q))
    );
    html = rows.map(hotCard).join('') || '<div class="empty">没有符合条件的条目</div>';
  }
  listEl.innerHTML = html;
}

function renderNotes(){
  notesEl.innerHTML = DATA.notes.map(n => `<div class="note">
    <div>${escHtml(n.content)}</div>
    <div class="nt">${escHtml(n.time)}${n.link ? ' · <a href="' + escHtml(n.link) + '" target="_blank" rel="noopener">链接</a>' : ''} · ${escHtml(n.status)}${n.feishu_link ? ' · <a href="' + escHtml(n.feishu_link) + '" target="_blank" rel="noopener">在飞书打开</a>' : ''}</div>
  </div>`).join('') || '<div class="empty">还没有速记</div>';
}

// 分段控件：数据源切换
document.getElementById('src-seg').addEventListener('click', e => {
  const btn = e.target.closest('button'); if (!btn) return;
  state.src = btn.dataset.src;
  document.querySelectorAll('#src-seg button').forEach(b => b.classList.toggle('on', b === btn));
  document.getElementById('level-filters').style.display = state.src === 'sub' ? '' : 'none';
  document.getElementById('status-filters').style.display = state.src === 'hot' ? '' : 'none';
  document.getElementById('search').placeholder = state.src === 'sub' ? '搜博主 / 标题…' : '搜选题 / 来源…';
  render();
});

document.getElementById('level-filters').addEventListener('click', e => {
  const btn = e.target.closest('button'); if (!btn) return;
  state.level = btn.dataset.level;
  document.querySelectorAll('#level-filters .fbtn').forEach(b => b.classList.toggle('on', b === btn));
  render();
});

document.getElementById('status-filters').addEventListener('click', e => {
  const btn = e.target.closest('button'); if (!btn) return;
  state.status = btn.dataset.status;
  document.querySelectorAll('#status-filters .fbtn').forEach(b => b.classList.toggle('on', b === btn));
  render();
});

document.getElementById('search').addEventListener('input', e => {
  state.q = e.target.value.trim();
  render();
});

// 灵感速记提交（Cloudflare Worker 代理，密钥不进浏览器）
document.getElementById('cap-btn').addEventListener('click', async () => {
  const content = document.getElementById('cap-content').value.trim();
  const link = document.getElementById('cap-link').value.trim();
  const okEl = document.getElementById('cap-ok');
  const errEl = document.getElementById('cap-err');
  okEl.style.display = 'none'; errEl.style.display = 'none';
  if (!content){ errEl.textContent = '写一句再存'; errEl.style.display = 'block'; return; }
  const btn = document.getElementById('cap-btn');
  btn.disabled = true; btn.textContent = '存…';
  try {
    const resp = await fetch('/api/capture', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content, link }),
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    okEl.style.display = 'block';
    document.getElementById('cap-content').value = '';
    document.getElementById('cap-link').value = '';
  } catch (err) {
    errEl.textContent = '没存上：' + err.message + '（可以去飞书表里手动补一条）';
    errEl.style.display = 'block';
  } finally {
    btn.disabled = false; btn.textContent = '存下来';
  }
});

render();
renderNotes();
</script>
</body>
</html>
