<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>内容雷达 · 乔帮主选题看板</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
:root{
  --bg-page:#f7f1e4; --bg-card:#ffffff;
  --hero-bg:#3d2436; --hero-fg:#f7f1e4;
  --fg-0:#2a2020; --fg-1:#7a6f68;
  --accent:#8a2f3f;
  --chip-rose:#f0d8d2; --chip-sage:#d8e3d3; --chip-tan:#ece0c4; --chip-mauve:#e6dbe6;
  --radius:14px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg-page); color:var(--fg-0);
  font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px; line-height:1.7;
}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 80px}

/* hero */
.hero{
  background:var(--hero-bg); color:var(--hero-fg);
  border-radius:var(--radius); padding:28px 26px 24px;
  margin-bottom:18px;
}
.hero .kicker{font-size:12px;letter-spacing:2px;opacity:.65;margin-bottom:6px}
.hero .big{font-size:44px;font-weight:700;line-height:1.15}
.hero .big small{font-size:16px;font-weight:400;opacity:.75;margin-left:6px}
.hero .guide{margin-top:8px;font-size:13px;opacity:.8}
.hero .meta{margin-top:12px;font-size:12px;opacity:.55}

/* 四宫格：每张卡片直接跳转飞书对应的表 */
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.chip{
  display:block;
  border-radius:var(--radius); padding:14px 14px 12px;
  border:1px solid rgba(42,32,32,.06);
  transition:transform .12s ease, box-shadow .12s ease;
  color:var(--fg-0); text-decoration:none; user-select:none;
}
.chip:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(61,36,54,.10)}
.chip .n{font-size:26px;font-weight:700}
.chip .t{font-size:13px;margin-top:2px}
.chip.c-rose{background:var(--chip-rose)}
.chip.c-sage{background:var(--chip-sage)}
.chip.c-tan{background:var(--chip-tan)}
.chip.c-mauve{background:var(--chip-mauve)}

/* 工具条 */
.toolbar{
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  margin-bottom:16px;
}
.seg{display:flex;background:#efe6d3;border-radius:999px;padding:3px}
.seg button{
  border:none;background:transparent;padding:6px 16px;border-radius:999px;
  font-size:13px;color:var(--fg-1);cursor:pointer;font-family:inherit;
}
.seg button.on{background:var(--accent);color:#fff;font-weight:600}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.fbtn{
  border:1px solid #ddd0b8;background:transparent;color:var(--fg-1);
  padding:5px 12px;border-radius:999px;font-size:12.5px;cursor:pointer;font-family:inherit;
}
.fbtn.on{background:var(--fg-0);color:#f7f1e4;border-color:var(--fg-0)}
.search{
  border:1px solid #ddd0b8;background:#fff;border-radius:999px;
  padding:6px 14px;font-size:13px;font-family:inherit;min-width:140px;color:var(--fg-0);
}
.search:focus{outline:2px solid var(--accent);outline-offset:1px}

/* 内容卡 */
.card{
  background:var(--bg-card);border-radius:var(--radius);
  padding:20px 22px;margin-bottom:14px;
  border:1px solid rgba(42,32,32,.05);
}
.card .head{display:flex;align-items:flex-start;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.tag{
  display:inline-block;font-size:11.5px;font-weight:600;
  padding:2px 10px;border-radius:999px;flex-shrink:0;line-height:1.8;
}
.tag.strong{background:var(--accent);color:#fff}
.tag.rec{background:var(--chip-rose);color:var(--accent)}
.tag.adopted{background:var(--chip-sage);color:#3f5a3a}
.tag.pending{background:#eee6d6;color:var(--fg-1)}
.card h3{font-size:17px;font-weight:700;line-height:1.5;flex:1;min-width:200px}
.card .sub{font-size:12.5px;color:var(--fg-1);margin-bottom:10px}
.card .sub a{color:var(--fg-1)}
.card .recommend{
  font-weight:700;font-size:14.5px;margin-bottom:10px;
  padding-left:10px;border-left:3px solid var(--accent);
}
.card .summary{border-top:1px dashed #e4d9c2;padding-top:12px;font-size:14px}
.card .summary h1,.card .summary h2,.card .summary h3,.card .summary h4{
  font-size:14.5px;margin:14px 0 6px;color:var(--accent)}
.card .summary h1:first-child,.card .summary h2:first-child,.card .summary h3:first-child{margin-top:0}
.card .summary ul,.card .summary ol{padding-left:20px;margin:6px 0}
.card .summary p{margin:6px 0}
.card .summary strong{color:var(--fg-0)}
.card .link-btn{
  display:inline-block;margin-top:12px;margin-right:18px;font-size:13px;
  color:var(--accent);text-decoration:none;font-weight:600;
}
.card .link-btn:hover{text-decoration:underline}

/* 速记 */
.notes-list .note{
  background:var(--bg-card);border-radius:10px;padding:12px 16px;margin-bottom:8px;
  border:1px solid rgba(42,32,32,.05);font-size:14px;
}
.note .nt{font-size:12px;color:var(--fg-1);margin-top:4px}
.note a{color:var(--accent);word-break:break-all}

/* 速记输入 */
.capture{
  background:var(--bg-card);border-radius:var(--radius);padding:18px 20px;margin-bottom:22px;
  border:1px dashed #d8c9a8;
}
.capture .ct{font-size:13px;font-weight:700;margin-bottom:10px}
.capture .row{display:flex;gap:8px;flex-wrap:wrap}
.capture input{
  flex:1;min-width:180px;border:1px solid #ddd0b8;border-radius:10px;
  padding:9px 14px;font-size:14px;font-family:inherit;background:#fbf8f0;color:var(--fg-0);
}
.capture input:focus{outline:2px solid var(--accent);outline-offset:1px}
.capture button{
  background:var(--accent);color:#fff;border:none;border-radius:10px;
  padding:9px 22px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;
}
.capture button:disabled{opacity:.5;cursor:default}
.capture .hint{font-size:12px;color:var(--fg-1);margin-top:8px}
.capture .ok-msg{color:#3f5a3a;font-size:13px;margin-top:8px;display:none}
.capture .err-msg{color:var(--accent);font-size:13px;margin-top:8px;display:none}

.empty{padding:40px 0;text-align:center;color:var(--fg-1);font-size:14px}
.section-title{font-size:15px;font-weight:700;margin:26px 0 12px;display:flex;align-items:center;gap:8px}
.section-title::after{content:"";flex:1;height:1px;background:#e4d9c2}

@media (max-width:640px){
  .grid4{grid-template-columns:repeat(2,1fr)}
  .hero .big{font-size:34px}
  .wrap{padding:14px 12px 60px}
  .card{padding:16px}
}
</style>
</head>

家”，客人会觉得老板人不错，改天想吃别的菜还会回来\n- 作者认为“来一个客户是一个客户，钱不能往外流”的想法做不大\n- 作者还提到曾建议几位朋友（包括一位上市公司创始人）重写书稿，因为内容脱离群众、与受众不匹配\n\n❤️ **第三条：同理心**\n- 线下三天活动几乎不讲知识：第一天主题是“放下”，第二天主题是“同理心”\n- 具体游戏设计：两人对视3分钟，不允许搞怪，认真看着对方眼睛诉说和倾听，90%以上的人会热泪盈眶\n- 另一个游戏“你是我的眼”：蒙上眼睛由同伴牵着走，体验恐惧与被接纳的过程，类比用户感受\n- 作者认为做自媒体最难的从来不是知识（“知识简单得要死”），而是心理问题：领导看见怎么办、亲戚看见怎么办、黑粉怎么办\n- 放下心魔、变得快乐绽放后拍出的视频，观众看着舒服，自然涨粉\n\n🎤 **线下活动的共创设计**\n- 厦门年会某天下午作者分享时，被几十人打断，“你下来，我上去讲两句”，很多人第一次站在几百人面前演讲，战胜自己后人生发生改变\n- 北京站三天活动流程随机、拥抱不确定性，根据大家情况不断调整，不是作者一个人讲、大家听\n- 作者强调：这个会不是“我的会”，是老伙计们自己的会，所以大家拍视频拍的是自己，顺带把作者带上了\n- 涨粉不是作者干出来的，是别人借他讲自己的时候顺带发生的\n\n🍗 **案例佐证：脆脆的炸鸡**\n- 作者举例河南小伙送炸鸡的视频：状态放松、真诚快乐，观众觉得酷、有意思，因为创作者自身状态好\n\n💡 **筛选标准与行动建议**\n- 作者筛选人看重人品而非能说会道，认为“老实巴交、不善言辞”的人成功率特别高，因为可信\n- 作者认为东西好、人好、踏实诚实、价钱好，通常能生活得很好\n- 行动建议：今晚做一件小事——把手上的产品、课程、活动留一个空位出来，写清楚要别人填什么，填的人越多，替你说话的人越多", "time": "2026-11-26 23:11", "link": "https://www.iesdouyin.com/share/video/7712498045027490195/", "adopted": false, "feishu_link": "https://vcnf6h45v8ij.feishu.cn/record/C4Jpr1mmbe3tZLcaFp4cteMgnLc"}, {"level": "推荐", "title": "AI自己点鼠标:ComputerUse能替你干哪一步？", "blogger": "清华姜学长", "recommend": "Computer Use让AI看屏幕操作鼠标键盘，替人填无法导入的老软件表单", "summary_md": "🖥️ **什么是Computer Use**\n-\n核心问题是：AI已能\"看懂\"信息（如读取发票金额、日期、发票号），但录入老财务软件仍需人工点\"新增\"、填表单\n- Computer Use要解决的就是让AI看着电脑屏幕、操作鼠标和键盘，把任务继续做下去\n- 典型场景：老财务软件无法直接导入数据，必须逐项手工填写，AI可替代这部分操作\n\n🔄 **四个环节：看、想、做、查**\n- **看**：系统把当前屏幕截成一张图，模型据此判断软件是否打开、停在哪个页面、有哪些按钮；全屏缩小后字看不清时可局部放大（如Claude工具支持指定区域查看）\n- **想**：模型结合任务判断下一步做什么，如找到\"新增\"按钮并确定其在截图上的具体坐标\n- **做**：模型给出操作指令，工具按坐标点击；表单打开后找到输入框填入金额、日期、发票号，可滚动页面、切换输入框、按快捷键\n- **查**：操作后需确认实际结果，如新增表单是否真打开、是否弹报错、保存后重新打开草稿核对金额和发票号，再决定继续填、回头改还是完成\n- 查到的画面又成为下一轮\"看\"的起点，任务就这样一轮轮循环推进\n\n🏢 **大厂布局时间线**\n- 2024年10月：Anthropic为Claude 3.5 Sonnet开放Computer Use公测，官方称能力很早期，简单操作也可能做不好\n- 三个月后：OpenAI推出能操作电脑的Operator\n- 2025年1月：相关模型（CUA）\n- 2025年10月：Google推出Gemini 2.5 Computer Use\n- 大厂押注的原因：现有软件大量环节需人动手，很多软件没给AI准备接口，但早就给人准备了按钮、菜单和输入框；AI看懂界面就能用现成入口，公司不必换掉整套财务软件，成本大幅降低\n- OpenAI发布GPT-5.1时也举了读取发票录入会计软件的例子，强调操作精度，并把标准API单价降到GPT-5和GPT-5.1的一半\n\n📊 \n\n💼 **工作辅助能力**\n- 小豆也能处理工作事务，如根据客户对脚本的意见整理反馈并提醒修改\n\n💡 **用户核心感触**\n- 以往用AI多为提升工作效率（写脚本、整理资料、总结客户反馈）\n- 小豆是第一个让用户觉得\"AI也可以帮我想怎么把生活过得更好\"\n- 以前只存在收藏夹里的生活，现在终于跑到了相册里\n- 感悟：工作没有真正忙完的时候，不应总等忙完再去做喜欢的事", "time": "2026-11-26 14:07", "link": "https://www.iesdouyin.com/share/video/7712296967694585097/", "adopted": false, "feishu_link": "https://vcnf6h45v8ij.feishu.cn/record/BNpproJdWe1WiGcyJ43c3As8nYT"}, {"level": "推荐", "title": "Gemini反重力！新手小白最全教程", "blogger": "FredTalk", "recommend": "Antigravity用一句话让AI开文件夹写代码开浏览器，按任务难度选模型", "summary_md": "🛠️ **Antigravity 是什么**\n- Google 旗下的 AI agent 工具，类似 Workbuddy、Codex，可用一句话指令让它在电脑上打开文件夹、写代码、开浏览器完成任务\n- 有桌面 APP 和命令行版本（叫 AGY），两者同一引擎、设置互通\n- 近期火爆的原因是背后模型 Gemini 升级到第 4 代，能力大幅提升\n- 作者一个月用它做了几十期视频，账号涨了 6 万多粉丝\n\n🧪 **模型选择（化学元素命名）**\n- Carbon（碳）：最强，干最难最长的活\n- Neon（氖）：中间档，兼顾深度与速度，是 Antigravity 默认模型，日常首选\n- Hydrogen（氢）：最快最省额度，免费版可用，适合改小地方、跑量的活\n- Argon（氩）：最早发布的版本，11 月 30 日下线，不用管\n- 名字并非按元素周期表排强弱（最强是碳不是氢），Google 未解释命名原因\n- LM Arena 文本榜（11 月 25 日数据）：Carbon 第一、Neon 第三，排在 Claude Opus 5.5 前；但 Web Dev 榜上 Claude Fable 5.2 和 Opus 5.5 仍居前二，Carbon、Neon 排第四第五\n- Antigravity 内可直接选 Claude 的 Opus 5.5 和 Sonnet 5.5\n\n📥 **第一阶段：装好它，做出第一个作品**\n- 新手建议先装 APP（有界面、点按钮即可用）\n- 官网下载：Mac 选 Download for Apple Silicon；安装包需拖进\"应用程序\"，不要直接在安装包里双击打开\n- 登录用个人 Google 账号（公司/学校账号用不了付费套餐）；有官方支持地区名单且要求年满 18 岁，提示\"没有资格\"时先查账号地区\n- 订阅三档：免费版（额度每周重置，可用 Hydrogen 体验）、AI Pro 约 19.99 美元/月（每 5 小时重置+每周上限，可用 Neon、Orchestrator、Claude 5.5 系列）、Ultra（100/200 美元两档，额度最高，全模型可用）；建议免费版跑通教程，真干活上 Pro\n- 界面：左侧为新建对话、automations、customizations、projects、conversations、settings；输入框周围有本机干活、选项目、选模型、权限锁、麦克风\n- 第一个作品：新建项目（选一个文件夹作为\"工位\"），输入\"帮我做一个个人主页，有头像、一句介绍和 3 个作品，风格简洁好看，做完打开给我看\"，几分钟即可生成可用网页，它会自己开浏览器截图检查\n\n⚙️ **第二阶段：把它用顺手**\n- 模型档位分 low/medium/high，档位越高想得越久越费额度；实测同一小页面 Hydrogen 用 52 秒、Neon 用 3 分钟但更讲究\n- Orchestrator：大模型负责想、快模型负责做，又快又省，适合大项目\n- 权限：新手用默认设置，运行命令或改重要文件时会弹窗询问，看一眼点允许\n- 每个新任务建议新建项目，避免一个对话越聊越长导致遗忘和烧额度\n- 界面目前是英文，但可用中文对话；在 customizations 规则里加\"始终用中文回复我\"即可；不建议装第三方汉化包\n- 大任务开头打斜杠 plan 先出计划，确认后再动手，能省多轮返工\n- 省额度三招：小活用快模型、大活先出计划、任务做完就新开对话\n\n🎨 **第三阶段：用出效果（前端与审美）**\n- 核心差别不在模型，而在怎么说话、给它看什么\n- 第一步：先找优秀参考图，说清三件事——什么产品、给谁看、要什么感觉（示例：虚构无线耳机 Arrow 发布页，深色背景、大标题、留白、苹果发布会高级感，分首屏/卖点/参数/购买四部分）\n- 第二步：加动效（下滑依次淡入、数字从 0 滚动、按钮悬停发光），Gemini 动效自然不乱闪\n- 第三步：加 3D（用 Three.js 做可鼠标拖拽旋转的 3D 耳机，灯光有质感），以前需前端工程师做几天，现在一句话搞定\n- 第四步：让它自己测——\"打开浏览器从上到下检查一遍，截图给我看，有问题直接修\"，它能发现标题掉字、按钮不等宽等问题并自行修复\n- 第五步：返修三句话——指位置（标题放大一倍）、给参照（配色参考这张图）、说感觉（再克制一点，去掉多余装饰）\n- 从普通页面到有设计、动效、3D 且自检过的发布页，前后约一小时\n\n💻 **第四阶段：命令行、规则、skill 与 MCP**\n- 终端粘贴官网安装命令，输入 AGY 进入；斜杠 model 换模型，用法与 APP 一致；好处是轻、可远程、可串联其他工具\n- 规则文件 gemini.md（项目内或全局）：相当于 agent 的入职手册，写清回复语言、字号、风格偏好，每次开工前先读；作者把\"禁止小字\"写进规则后问题再没出现\n- skill 是反复交代流程的说明书；MCP 像 USB 接口，可连浏览器、数据库、设计软件\n- Antigravity 会读公共 skill 文件夹，给 Codex 写的 skill 也能直接用；作者一套 skill 供 Claude、Codex、Gemini 三者共用\n\n🤖 **第五阶段：自动化与多 agent**\n- automations 定时任务：如每天早上 8 点自动整理昨天的 AI 新闻\n- 斜杠 swarm 开多个 agent 并行干活；Google 官方演示过一群 agent 并行 12 小时做出图灵书房和可运行的图灵机\n- remote control 手机遥控：出门在外可查看进度、点按批准\n\n🎬 **第六阶段：用它做一条视频**\n- 把 1 分钟小稿交给它，指定用作者的 Flat Talk skill 做横版视频，要求画面干净、字大、做完自检\n- 它会拆镜头、逐段写画面、渲染、抽帧检查\n- 成片约九成完成度，两个小毛病：角落爱塞小字、字多被挤成两行，用规则文件锁住即可解决\n\n❓ **新手常见问题**\n- 免费版体验学习够用，天天干活上 Pro\n- 额度用完等重置或换 Hydrogen\n- 回复慢是因为档位高，小活调低档位\n- 无中文界面，规则里写中文回复即可\n- 提示没资格先查账号地区和年龄，再对照官方名单\n- 作者分工：Claude 当主力做判断和审美，Codex 负责执行求稳，Gemini 负责前端并作 Claude 替补", "time": "2026-11-26 11:09", "link": "https://www.iesdouyin.com/share/video/7712311966047489306/", "adopted": false, "feishu_link": "https://vcnf6h45v8ij.feishu.cn/record/KNWarNw7pesLR8cVabpca6Xwn7d"}, {"level": "强烈推荐", "title": "像高手一样做自己的Skill！【小白教程】", "blogger": "秋芝2046", "recommend": "Skill本质是任务说明书文件夹，只把反复做且AI裸做不好的事做成Skill。", "summary_md": "📌 **Skill的本质与核心逻辑**\n- Skill本质上就是一个文件夹，核心是一个Skill.md文件\n- Skill.md上方写明\"什么时候用\"，下方写明\"整体怎么干\"，更细的步骤作为附件放在其他文件中\n- 整个Skill就是一份给Agent的任务说明书\n- Skill的安装和使用Agent自己都会，无需额外学习\n\n🎯 **第一步：挑对事儿**\n- 值得做成Skill的事只有两条原则：你真的会反复做，且直接让AI做它做得不好\n- 案例演示使用Codex，左侧是Agent对话区，右侧可编辑文件\n- 先让AI裸跑一次（如\"去AI味儿\"改文章），结果AI换了一套新的AI味，证明直接让AI做效果不好\n\n🧱 **第二步：找一个Skill的底子**\n- 两条路径：让Agent搜索现成成熟Skill在其基础上改，或用官方Skill Creator作为底子\n- 下载现成Skill要留意更新时间，很多是给老模型写的，写死的规矩会束缚新模型\n- 换新模型后建议先关掉Skill裸跑任务，若不如不用Skill则直接删掉\n- 案例中找到国外热门Skill\"Humanizer\"（近7万行，几天前还在更新），让Codex下载到项目中\n- Humanizer已抽象出6种AI腔规律，成熟度很高，可直接当底子\n- 试用后发现AI味少了但仍不像本人，因为缺少个人味道\n\n📊 **第三步：加入自己的味道（关键数据支撑）**\n- Skills Bench研究数据：仅让AI凭空写Skill，用了比不用还差8~12个点\n- 网上热门Skill一大半装了跟没装一样\n- 结合真实任务打磨的Skill平均能涨16.6个点\n- 原因：AI不懂你的目标和任务细节标准\n- 方法：准备10篇以上自己写过的东西（最好没用AI写过，聊天记录、朋友圈、微博均可）\n- 让Agent统计可数数据（句子长度、标点用法、高频口头禅）作为个人标签\n- 不好数的特征（如何开头、如何转折）总结成规律并附原文作证据\n- 案例中作者发现自己60段稿子有10段以\"那\"开头，虽是个人味道但想改掉\n- 风格清单需自己仔细过一遍，分成\"要留下的、要改的、想加的\"\n\n🔁 **第四步：用真实任务反复打磨**\n- 拿一件真要做的事，让AI使用底子Skill结合风格清单改写\n- 读一遍，标出不像的句子并打评论，告诉AI\"如果是你会怎么写\"\n- 反复几轮直到读起来像自己\n- 打磨中收获的细节标准，再调用Skill Creator存成新Skill并起自己的名字\n- 注意：在别人基础上改，必须保留原作者署名和MIT协议\n\n✂️ **第五步：砍内容和拆文件**\n- AI容易只增不删，但Skill文件越短越精简效果越好\n- 手动删掉AI本来就会的内容，删掉与目标关系不大的低频情况（如英文相关习惯）\n- 可让Agent自检删除，也可边看文件边评论\n- Skill.md只留主流程和目录，样文、统计、检测脚本放到reference文件夹和scripts文件夹\n\n🧪 **第六步：三组对照测试**\n- 用同样提示词、同一件活，让Agent调用3个子Agent跑结果\n- 三组：不装Skill裸跑、装底子Skill、装改好的版本\n- 盲评哪个最好，仔细查看哪些指令真正影响了结果\n\n🔄 **第七步：持续迭代（含避坑要点）**\n- Skill真正的生命是在使用中不断迭代变好\n- 避坑一：不要不停往Skill里加\"不要这样不要那样\"的禁令，禁令越攒越多AI反而不知道正确做法\n- 正确做法：抓到错误先问AI\"为什么这样做\"，一起找背后规律和模式，写一条规律拦住同类问题\n- 技巧：在Skill末尾加一句\"每当我纠正你或夸某个结果好时，请主动跟我复盘，问我要不要更新进Skill\"\n- 定期把满意的新参考换进参考资料\n- 模型更新后记得关掉Skill裸跑一次，有些规矩可以删掉\n\n💡 **总结理念**\n- 做Skill没有技术门槛，反而像带实习生\n- 挑一件值得教的事→找现成方法当底子→把好效果给他看→带他亲自做一遍→考考他\n- 每纠正一次，他就长进一次\n- 作者做好的Skill已放在评论区，需按第三步做成自己的味道", "time": "2026-11-25 21:43", "link": "https://www.iesdouyin.com/share/video/7712104135608356122/", "adopted": false, "feishu_link": "https://vcnf6h45v8ij.feishu.cn/record/DvjarhzW0eCkVWchlk9cW1MrnYe"}, {"level": "推荐", "title": "你一直在做加法", "blogger": "姜胡说", "recommend": "知识没改变生活就是不会，先按当下水平发出去再回头改。", "summary_md": "🔍 **核心问题：加法式学习的陷阱**\n- 大多数人学一个东西拍条视频，再学一个东西再拍条视频；今天接个项目，明天再接一个，每个动作都在挣钱，但处理系统一个字没变\n- 今天学的东西，明天用的时候还是那个水平，更麻烦的是不知道自己学的到底有没有用\n- 很多人把“大量输入+输出”当作费曼学习法，但处理系统几乎没有升级\n- 知识如果真会，一定能改变生活；没改变就是不会，只是把别人的知识存进脑子，相当于一个U盘\n\n🔄 **方法一：先按当下水平发出去，再回头改**\n- 写文章不打草稿，有想法两三分钟写出来，改错别字就发，发出去那版就是当下的真实水平\n- 类比：有人一拳打过来，你没时间研究怎么破解，下意识就是你的真实水平\n- 发出后10~15分钟回看，哪句别扭改一遍；过几天再改；过几个礼拜、一两个月接着改\n- 改的那个部分，就是升级的部分——修改的过程就是升级处理系统的过程\n\n🔧 **方法二：别总想做新东西，持续改旧东西**\n- 很多人憋一个大爆款，作者一直在改旧东西：文章改、专栏改、视频改\n- 每改一遍，处理知识的能力就涨一点\n- 结果：现在写一小段二十分钟搞定，拍视频打开手机就拍，不用稿子\n\n📊 **拍视频的进阶：预判—验证—修正**\n- 发之前心里有个估算：这条收藏会高、评论会高还是关注会高，依据是当下对平台、对用户、对自己的理解\n- 发完看真实数据，如果收藏率跟想的差很远，说明判断错了\n- 判断错特别值钱：错了、发现了、改过来，那才是你的\n- 对了不声张，多一个工具箱；错了不亏，多一条错题本；攒一年，处理信息的本事跟别人不是一个量级\n- 数据反馈可以佐证或修正对用户、平台、选题的理解，逐步建立工具箱和错题本\n\n⚠️ **关于“看号”的忠告**\n- 作者拒绝帮人看号，原因是很多人基本功极差但欲望很高\n- 类比：看了一个月的书就问为什么考不上清华\n- 有极深独立思考能力、基本功在的人，只需指一个方向或点出问题，他自己会想办法\n\n🎯 **IPO逻辑：升级处理系统而非做加法**\n- 多数人关注输入和输出，把关注度放在“怎么大量输入”上，但处理系统（P）几乎没升级\n- 作者的做法：输入→输出→根据反馈不断升级处理系统→消化能力越来越强→输入时能快速处理、快速输出\n- 本质：不是做加法，而是构建自己处理知识的能力\n\n✅ **今晚的行动建议**\n- 翻自己三个月前写的东西，随便一篇，改一遍\n- 改完会发现：你不是不会，你是从来没回头看", "time": "2026-11-25 21:31", "link": "https://www.iesdouyin.com/share/video/7712101131773744575/", "adopted": false, "feishu_link": "https://vcnf6h45v8ij.feishu.cn/record/M99Prx8loeIRBOcHjnccHZjonyg"}, {"level": "推荐", "title": "这两年学AI，很多人学的是怎么挑工具。微软刚在Ignite上更新了Copilot，我觉得接下来更要紧的，可能是把想做成什么说清楚。@微软科技", "blogger": "清华姜学长", "recommend": "AI用法从人适应工具转向把目标说清楚，由AI组织所需能力。", "summary_md": "🤖 **核心观点：AI 用法正在发生转变**\n- 过去人们使用 AI 前需要先想清楚用哪种工具，如 Check、Deeply Search、Agent、Coding 等，选择成本高\n- 作者判断 AI 用法正从“人去适应工具”转变为“人把目标说清楚，AI 来组织需要的能力”\n- 现在的 AI 已能根据目标和上下文，把一件事拆成几步，并安排每一步调用什么能力\n- 未来发展方向是让普通人不用学那么多工具\n- 微软 Ignite 大会官方博客提出核心观点：技术应该服务于人，而不是让人去适应技术\n- Copilot 的几项变化正是把这一方向落实到具体工作中：既可以在里面问问题，也可以把一件事交给它做\n\n📝 **场景一：写周报**\n- 过去问 AI 写周报，得到的往往只是几条建议或一段草稿，数据和工作记录仍需自己整理，再贴进 Word 修改\n- 现在可以直接说清楚周报给谁看、重点写什么、最终交付成什么样，再把工作记录和数据表格交给 Copilot\n- Copilot 会自己查看材料、整理重点、组织内容，最后给出一份可以直接修改的文档\n- 省下的不只是写的时间，还有中间来回交代的功夫：以前要自己想好让 AI 做到哪一步、做完再问什么，现在只需讲清目标和材料，中间步骤由 Copilot 排好\n\n👥 **场景二：跟踪招聘进度**\n- 作者自己在创业，长期招人，现成招聘工具常与自己的流程对不上\n- 需求举例：查看一个候选人过了几轮、每轮谁负责、卡在哪一步、超过几天没推进就自动标出\n- 以前要么迁就现成招聘系统，要么自己一点点打表格\n- 这次 Copilot 的变化：可以用自然语言把需求讲清楚，让它按自己的工作方式搭一个能用的工具\n- 例如讲清流程分几轮、每轮谁负责、超过几天没推进就标出，它就能直接搭出一个招聘进度看板\n- \n- 传递能力包括写文案、表达、沟通、自媒体能力等\n- 经典案例：去头屑用海飞丝、怕上火喝王老吉——让用户一想到需求就想到你\n- 表达的核心是让别人真的知道你的东西好，而非纠结于说话是否啰嗦\n\n🚀 **分发能力：从“知道+买到”到“call to action”**\n- 过去模式是“让用户知道，且让用户买到”（如楼下买洗发水）\n- 互联网、快递、支付普及后，变成“call to action”——用户知道的同时就能立即行动、支付、收货\n- 分发能力指一篇文章十万人看到、一条视频百万人看到的能力\n- 掌握“让别人知道”和“分发”两种能力，即使卖别人的产品也能赚钱\n\n📦 **产品形式：价值的载体**\n- 产品形式可以是专栏、社群、软件、书、代做、咨询、教程、流程等\n- 形式取决于你能提供什么价值：分享“来时的路”适合专栏/社群；帮人做决策则适合软件等\n- 产品只是价值的载体，没有价值光做形式（如跟风做专栏、社群）没用\n- 作者的产品逻辑：把来时的路（创业、产品、营销、咨询、投资、AI、自媒体经验）分享给过去的自己，专栏承载分享，社群承载答疑\n\n🏰 **护城河：凭什么是你做**\n- 要思考：你做得更好？更便宜？更快？还是只有你能做？\n- 作者护城河：真正干过、经验丰富、免费分享质量高、价格便宜、不满意可退费\n- 类比：用DeepSeek因为又快又便宜，用Claude因为好\n- 核心问题：凭什么你做而不是别人做\n\n🤝 **合作伙伴：用户即合伙人**\n- 作者的合作伙伴恰恰是用户（不叫学生，叫“老伙计”）\n- 社群目标从来不是赚用户钱，而是把用户变成合伙人\n- 合伙人角色包括：测试人员、义务推销员、产品分销者、产品贡献者\n- 真心帮助别人成长，对方受益后会自动帮你传播（作者一个月涨100万粉丝即源于此）\n- 社群对作者来说是土壤，从来不是产品\n\n💰 **财务模型：收益=利润×用户数×复购**\n- 单价取决于你能给别人提供的价值，不取决于成本\n- 知识类产品成本几乎为零（总结自己走过的路）\n- 护城河极深：这个事不赚钱也做，赚钱只是副产品，竞争对手无法PK\n- 找到一件不赚钱也愿意做的事，就进入不败境界\n- 完整公式：收益 = 利润 × 用户数 × 复购\n\n🔄 **完整商业模式回顾**\n- 第一步：找到用户，明确能提供什么价值、解决什么问题\n- 第二步：让别人知道你能提供（传递能力）\n- 第三步：通过分发让更多人知道（分发能力）\n- 第四步：选择合适的产品形式作为价值载体\n- 第五步：建立护城河，明确凭什么是你做\n- 第六步：找到合作伙伴补齐能力\n- 第七步：算清单价、成本、利润、用户数、复购", "time": "2026-11-22 22:49", "link": "https://www.iesdouyin.com/share/video/7711008042783169206/", "adopted": false, "feishu_link": "https://vcnf6h45v8ij.feishu.cn/record/RYgzrNEfDeL8ckc0P1Dc3jXWn5g"}, {"level": "强烈推荐", "title": "你存下的AI总结，可能早就过时了", "blogger": "清华姜学长", "recommend": "AI总结会过时：总结时附上原文链接、日期和原句，用前再让AI对照最新原文核查。", "summary_md": "🔍 **问题背景**\n- AI总结活动通知等时效性内容后，若原文更新（如活动时间从晚上6点改到8点），已保存的总结不会自动同步更新\n- 常用工具如Notebook LM生成的报告、音频概览，原文修改后也不会跟着变化\n\n📌 **方法一：总结时预留溯源线索**\n- 做总结时多加一句要求：每条结论后面写上原文链接、发布日期，以及引用原文中对应的那句话\n- 以活动通知为例，总结里\"6点开始\"后面会跟着通知链接、发布日期和原文原句\n- 日后想确认时，点回原文一看便知\n\n🔄 **方法二：使用前让AI对照最新原文核查**\n- 在转发给别人或照着做事之前，把原文最新版本和之前存的总结一起交给AI\n- 提示词示例：\"这是我之前存的总结，下面是原文最新的版本，请对照告诉我哪些结论已经不成立了、哪些有了新的补充、哪些没变，不确定的地方标出来，不要去猜\"\n- 以活动为例，AI会单独列出变化项：开始时间从6点改到8点，其他没变，只需看这一处即可放心转发\n\n⏰ **方法三：会变的内容交给工具定时跟踪**\n- 部分工具已支持自动同步：如放在Google Drive中的文件修改后会自动同 ps://vcnf6h45v8ij.feishu.cn/record/DuXLrXgaueRCZkcbOCncYJflnkb"}, {"level": "推荐", "title": "零基础DeepSeek", "blogger": "木子不写代码", "recommend": "按API用量付费的成本控制：选便宜模型、避开高峰时段跑自动化", "summary_md": "📦 **安装与登录**\n- 支持 Mac OS 和 Windows 系统，操作一致\n- 打开安装包按提示操作，结束后弹出窗口，按指引授权登录即可进入界面\n- 左下角设置中可查看剩余额度\n\n💰 **费用机制与成本控制**\n- DC Honey 完全按 API 用量付费，无订阅制，用多少花多少\n- 缺点：订阅制智能体（如 Codex）给的额度往往高于付费金额，用量极大时反而不如订阅制划算\n- 节省成本方法一：Flash 模型比 PRO 模型便宜非常多\n- 节省成本方法二：高峰期（北京时间 9:00-12:00、14:00-18:00）价格是空闲时期的两倍，自动化任务可安排在空闲时期执行\n- 缓存命中价格约为未命中的 1/50（百万 token 输入缓存命中 0.02 元，未命中 1 元）\n\n🧠 **缓存命中原理**\n- 模型没有记忆，每轮对话需将系统提示词、工具清单、历史上下文、文件内容和新问题整包发给模型\n- 缓存命中：之前已计算过的内容存在服务器上，无需重新计算\n- 缓存未命中：新内容需要重新计算\n- 对话 20 轮时缓存命中率可达 98.4%，轮次越多命中率越高\n\n🔧 **提高缓存命中率的四个技巧**\n- 相关的活尽量在同一个任务里接着做，不要频繁开新对话\n- 任务执行前想好用什么模型，不要中途频繁切换模型（换模型等于换一套缓存）\n- 执行任务前想好装什么插件、用什么 MCP，不要做到一半装卸插件或开关 MCP\n- 不要频繁手动压缩上下文（/compact 命令），手动压缩的新信息属于缓存未命中，会降低命中率；上下文快满时 DC 会自动压缩\n\n🖥️ **界面元素**\n- 工作区：一个文件夹，AI 可在其中自由读写文件，出了文件夹需询问\n- 三种权限：仅可查看（哪里都不能写）、工作区修改（仅文件夹内可写）、完全权限（整台电脑可读写，事后才知道）\n- 模型与推理等级：Off 不思考直接回答，Low 约 50 分、Hi 约 75 分、Max 约 100 分思考强度，单价不变但思考越多花费越多\n- 设置-通用设置中可调整工作步骤展示（详细/标准/简洁/完全展开）\n- 任务执行后可查看用时、token 用量、缓存命中率、上下文占用（窗口 100 万）、系统提示词/工具定义/对话消息占比\n- 轨迹页面：颜色块与细节一一对应，灰色为系统提示词、绿色为上下文、蓝色为提示词、紫色为模型（浅紫为输入到吐出第一个字，深紫为完成回答）、橙色为调用工具\n\n🧩 **插件生态与底层原理**\n- 绝大多数智能体（以 Codex 为例）的插件包含技能、MCP、应用、钩子，但无法修改对话循环、压缩聊天记录、审批流程、读写文件方式、记忆系统和界面\n- 比喻：Codex 像出厂打包好的电动车，稳定但自由度低；DC Honey 像乐高拼的车，启动时有一份插件清单，连自带模块都可拆换\n- 一轮对话可拆为四步：给提示词→打包上下文给模型→模型调用工具→工具结果返回模型；Codex 插件只能影响第三、四步，DC Honey 可影响全部四步\n- DC Honey 目前没有统一的安全边界系统，企业统一管控需在软件外想办法（如系统权限锁配置、走网关）\n- 官方统计第三方插件已超 3.5 万个\n\n🛒 **插件市场与推荐插件**\n- 社区插件市场 dsh market 本身也是一个插件，右上角添加插件输入名称安装\n- 用量和计费插件：显示每轮对话花费及输入/输出占比\n- Switch Context：提供上下文洞察面板，查看近 7 天 token 统计、各部分占比、耗时、工具调用细节\n- dsh skill manager：管理本机所有技能（含 Codex、Claude 等注入的技能），可查看详情、关闭和激活\n- Modeles：把图转文字，让只能读文字的 V4 PRO 模型能够读图\n- dsh mediaex 自媒体工作台：需手动粘贴安装，含灵感、内容、排期、复盘、风格等页面，可一键成稿（DC 本身无生图模型，需自行接入）\n\n🎛️ **四个内置模式**\n- 本质区别是默认加载的插件清单不同\n- 标准模式：27 个插件，涵盖日常任务所需功能\n- PTC 模式：模型不直接调工具，而是写程序循环调工具，适合批量重复任务（如检查 50 个配置文件），既省成本又提效\n- 基建模式：仅 7 个最基本插件，控制变量用于对比模型性能\n- 创造模式：比标准模式多两个插件（了解现有插件、搜索插件），用于开发自己的插件\n\n🛠️ **自制插件实践**\n- 案例：制作\"当前项目栏\"插件，在聊天窗口顶部显示项目名称、阶段进度和提醒语，可随时修改\n- 用创造模式对话约 18 分钟完成，插件出现在已安装列表中\n\n🏢 **企业定制案例：青石软件公司**\n- 公司背景：卖财务软件，靠服务挣钱，顾问上门实施和长期运维\n- 五块业务：售前、研发、实施交付等，智能体主要服务实施和交付（谈需求、配系统、换旧系统、上线排障）\n- 顾问会接触客户服务器地址、数据库密码等敏感信息，不能发送到官方模型服务器\n- 三种传统方案均有缺陷：禁用 AI、手动删除（慢且易漏）、Codex 钩子（无法修改智能体与模型之间的信息传递）\n- 第四种方案：DC Honey 脱敏插件——发模型前将敏感信息替换为代号，代号表只存本地，返回后再还原；密码需客户自己填写\n- 敏感信息识别：电话、IP、银行账号靠规则识别，人名、公司名靠每个客户的敏感词清单\n- 审批插件：涉及客户服务器的命令需青石项目经理和客户 IT 两人同意才放行，任一人拒绝即拒绝，3 分钟超时也算拒绝，审批结果写入工具结果告知模型\n- 规则插件：拦截危险命令（如删库），只读命令放行\n- 多层防范：合同是否允许用 AI→客户是否自部署模型→公司统一网关→每台电脑上的 DC 脱敏插件\n- 定制流程：关闭\"使用官方模型 API 时上传 session log\"→创造模式→新建普通客户模式→沉淀公司资料为技能→用 MCP 连接客户管理系统→加规则插件→做脱敏插件→做审批插件→改界面（换 logo、品牌色、项目栏）→打包安装包（避免绝对路径和用户名，附同事安装说明）", "time": "2026-11-20 18:33", "link": "https://www.iesdouyin.com/share/video/7710199941561404681/", "adopted": false, "feishu_link": "https://vcnf6h45v8ij.feishu.cn/record/TGTOrUgSpezF6QcNlZJcnaWunmf"}, {"level": "推荐", "title": "我主持了一场14个AI产品的发布会", "blogger": "Koji杨远骋", "recommend": "腾讯一个订阅打通文档网盘等办公产品，管理后台收拢到一个控制台", "summary_md": "🎤 **发布会概况**\n- 作者在深圳主持了腾讯14个AI产品的发布会直播\n- 覆盖To B、To C、生产力工具、云服务等多个方向\n- 14位AI产品负责人轮番登台，分享新产品与新进展\n- 整场直播持续三个多小时\n\n💼 **Work Body：从自己用升级为团队一起用**\n- 最值得关注的是\"Body One\"计划：只需一个订阅，腾讯文档、腾讯网盘、腾讯乐享、艾玛等办公产品全都能用上\n- 打通了不同账号、不同权益之间的壁垒\n- Work Body高级产品经理李鱼表示：把所有腾讯办公产品放在一个订阅里，通过Work Body的底座打通，管理后端收拢到一个控制台，解决管理分散的问题\n- 企业用户现在还可以订购Work Body企业版\n- 每个席位都会带上五款腾讯办公Agent，所有产品的AI用量走同一个企业Credit池，企业只收一套账单\n- 从自己用升级为团队一起用后，每个人的Skill以及上下文都可以复用到团队，沉淀为组织资产\n- 被称为走向AI时代超级Native组织的第一步\n\n📚 **艾玛：过去积累的经验有了新用法**\n- 艾玛产品负责人在直播中分享了一个案例：历史老师\"定哥\"把自己26年的教学资料放进艾玛知识库\n- 他还在教室放了一台设备，学生可在老师没时间一一回答问题时直接向设备提问，从定哥过去的资料里找到答案\n- 作者感悟：AI越普及，攒下来的资料和经验就越值得认真整理，因为它们有机会变成别人随时用得上的能力\n\n🛒 **云小莫：AI进入做生意的具体环节**\n- 腾讯云旗下产品\"云小莫\"在发布会上亮相\n- 举例：商家手里有竞争力商品想开网店，传统商家常卡在开店这一步\n- 商家只需告诉云小莫开店想法、优势商品、定价和折扣，AI就能快速把网店开出来\n- 还会生成全套营销方案，包括优惠券安排、会员激励设计等\n\n📝 **主持收获**\n- 作者全程聚精会神听完14位负责人的分享，收获很大\n- \"十字路口\"已发布一篇较长的 mi、GLM、Claude、GPT；workbuddy可在混元、DeepSeek、Kimi间切换，换大脑效果差异大\n- Stack Overflow调查12000多位开发者：用得最多的编程Agent是Claude，65.5%的人用过\n\n🏢 **三楼：平台层（工作室）**\n- 典型是视频平台：字节小云雀、Libby TV、Flowa；在Libby TV可直接选Seedance 2.5、MiniMax H3、可灵、Seedream 5.5，丢入剧本后Agent自动拆分镜、画角色、出镜头、配音剪辑\n- 其他房间：设计Lovat Stitch、一句话做网站Lovable秒搭、搜资料蜜塔、Notion KM、自搭Agent扣子\n- 模型聚合平台：OpenRouter、硅基流动，一个账号可调上百个模型\n\n💡 **实用建议与三问法**\n- 新手从三楼挑一个与工作最接近的平台先用起来，需要更多控制时下到二楼用Agent搭自己的流程\n- 遇到新工具问三个问题：它在哪一层（大脑、手脚还是工作室）？背后用哪个大脑？帮我省掉了哪一步？", "time": "2026-11-20 07:55", "link": "https://www.iesdouyin.com/share/video/7710035392921111842/", "adopted": false, "feishu_link": "https://vcnf6h45v8ij.feishu.cn/record/ERigrLxDeecr2SccYuvcoci2nuc"}, {"level": "推荐", "title": "视频是资产不是流量", "blogger": "姜胡说", "recommend": "从用户问题里筛共性选题，把每条视频当产品做，直接给可落地步骤", "summary_md": "🎯 **选题逻辑**\n- 不从常规选题库找拍摄主题，而是从用户提出的问题中筛选内容\n- 排除纯个人问题，只选择具备普适性的共性重要问题进行一对多回复\n- 提前思考问题的受众群体、遇到问题的场景、困扰点以及对应的解决方案\n\n📝 **拍摄流程特点**\n- 不依赖短视频技巧、钩子和刻意设计的流量结构，相关技巧已完全内化\n- 开篇直接对准受众痛点与卡点，清晰说明问题本质并给出可落地的12345操作步骤\n- 不准备逐字稿，仅用3-5分钟简单构思视频的服务对象与解决的问题，直接开拍\n- 单条视频定位为产品，用户观看视频支付的是时间成本，内容需具备直接解决问题的价值\n\n🤖 **AI赋能内容复用**\n- 拍摄完成后才使用AI工具，将视频录音转成的文本导入个人知识系统\n- AI自动在知识库中匹配同类问题的其他解决方案，补充内容的不同侧面\n- 同一问题可从不同角度、搭配不同案例多次产出内容，实现原有内容的迭代升级\n\n♻️ **多层级内容复用路径**\n- 第一层复用：助理调取过往同问题的所有解决方案，融合博主的思考逻辑回复新的用户提问\n- 第二层复用：将高频共性问题整理重构为垂直领域专栏，持续迭代升级\n- 第三层复用：对专栏内容深度理解后进一步整合，最终形成正式出版的书籍，博主的书籍已完成第20次印刷，上市后很快售罄\n\n📈 **资产化长期价值**\n- 内容不追逐热点、不迎合平台流量分发逻辑，而是适配搜索逻辑，精准匹配用户的问题检索需求\n- 近期30天涨粉97万，核心原因是过往积累的干货内容在用户搜索时形成强力背书，带来持续的自然流量\n- 内容不会随时间失效，反而像老酒一样随时间沉淀增值，后续还会多次触发流量增长\n- 对比多数创作者追逐短期流量、内容快速失效的模式，这套方法产出的内容是可长期增值的个人资产\n\n💡 **延伸核心认知**\n- 反对接外部项目做完就归零的模式，这类项目即便单次盈利，也无法沉淀属于自己的积累\n- 个人时间有限，所有产出都要服务于自身资产积累，长期沉淀可形成问题库、专栏、咨询方案、书籍等多种自有产品", "time": "2026-11-19 23:12", "link": "https://www.iesdouyin.com/share/video/7709900767659078372/", "adopted": false, "feishu_link": "https://vcnf6h45v8ij.feishu.cn/record/YdcqrAm5xeW5rycgjvxcxZ8LnRf"}, {"level": "推荐", "title": "一分半钟把AI写的项目画成一张地图", "blogger": "清华姜学长", "recommend": "用一句话让AI把项目代码画成可点击的大白话地图，看懂模块关系 opted": false, "feishu_link": "https://vcnf6h45v8ij.feishu.cn/record/Of1vrSNjXeNmsLca1EZcCbdcngk"}, {"level": "强烈推荐", "title": "AI剪的视频为什么廉价？问题是加太多", "blogger": "FredTalk", "recommend": "月产50条AI视频经验总结的四个廉价感信号与成因。", "summary_md": "💡 **AI剪辑廉价感核心成因**\n- 并非AI不具备剪辑能力，反而是AI过于勤快，将所有可添加的元素全部堆砌到视频中\n- 花哨、廉价、缺乏节奏是AI剪辑视频最直观的共性特征\n- 分享者自身有月产出50多条AI剪辑视频的实操经验，踩过全部相关坑点\n\n⚠️ **四个典型廉价信号**\n- 第一点：每句话切换一页画面，说一句更换一张卡片，本质是PPT轮播效果，观感生硬重复\n- 第二点：视觉风格混乱，短时间内频繁切换多种不同画法，单看元素尚可但组合后违和感强烈\n- 第三点：大量使用AI生成的虚假元素，比如自制按钮、假进度条、虚构后台界面，观众会下意识产生不真实感\n- 第四点：画面内容复读，同一信息重复展示多遍，大幅降低观看体验\n\n✅ **针对性减法优化方案**\n- 针对逐句换页问题：一段内容仅使用一个画面，画面内元素随讲解内容动态变化，不再逐句翻页\n- 针对风格混乱问题：一组内容固定使用同一个舞台、同一个底色、同一张工作台，仅替换内部展示内容\n- 针对虚假元素问题：严格限定仅使用真实素材，包括真实网页截图、真实后台数据、真实往期封面\n- 针对画面复读问题：冗余大标题能删就删，单句话仅点亮一个核心关键词\n\n🎯 **核心结论**\n- 当前AI剪辑工具的能力已经趋于同质化，大家使用的技能包和组件基本一致\n- 未来拉开剪辑质量差距的关键，是创作者明确知晓哪些元素不该添加，自主把控视频的节奏与审美\n- 操作核心是主动告知AI哪些内容禁止制作，而非任由AI自由发挥堆砌元素", "time": "2026-11-13 08:00", "link": "https://www.iesdouyin.com/share/video/7706893007055850802/", "adopted": false, "feishu_link": "https://vcnf6h45v8ij.feishu.cn/record/W0atrUIrNekkk7ct0OJcKIJln0c"}, {"level": "强烈推荐", "title": "一条视频教你一套自己的模型评测标准", "blogger": "清华姜学长", "recommend": "别只看榜单跑分，从自己工作场景出题建20道专属题库来判断模型好坏", "summary_md": "📊 **榜单跑分的局限性**\n- 各类AI模型发布后宣传的榜单高分，对普通用户来说参考价值有限\n- 榜单是统一考卷，考核的是大众普遍关注的内容，未必匹配个人实际需求\n- 竞赛题表现优异不代表模型能完成写周报这类日常实用任务，用户看完榜单仍无法判断是否该更换模型\n\n💡 **专属自测题库的核心思路**\n- 与其参考他人跑分和演示，不如从自身生活工作场景出发定制评估题目\n- Google Gemini产品负责人在访谈中提到，招聘产品经理时会考察对方是否有自己判断模型好坏的专属场景\n- 官方建议先自行编写题目，自己担任评分人，逐步积累到20道左右的专属题库\n\n🔍 **选题的具体方法**\n- 回顾近一周内自己实际让AI处理过的任务，从中筛选合适的题目\n- 优先挑选AI能完成基础效果，但仍需要手动调整的任务，比如AI写的邮件语义正确但语气不符合个人习惯，需要反复调整的场景\n- 避开过于简单、所有模型都能轻松完成的题目，这类题目无法区分不同模型的表现差异\n- 也避开完全超出当前AI能力范围的题目，这类题目看不出不同模型的进步差距\n- 按照官方标准，要挑选模型已经有初步完成苗头，但按个人标准还不够完善的任务\n\n✅ **明确评分标准的重要性**\n- 每道自测题都要提前明确写下合格的判定标准，不能只凭主观感觉\n- 没有书面化的明确标准，后续更换模型评估时只能凭模糊感受对比，无法得到客观结果\n- 举例：判断口播稿改写质量的标准只有两条，一是念出来通顺流畅，二是内容里包含自己的独立判断\n\n📝 **作者自用的5道自测题**\n- 第一题：将一段访谈记录整理成3个核心要点，不能遗漏关键判断，也不能添加原文不存在的内容\n- 第二题：给零基础人群讲清楚一个专业概念，不能用术语去解释另一个术语\n- 第三题：从一段口头稿件里挑出最不通顺的段落改写，改写后内容念出来要足够流畅\n- 第四题：阅读一个GitHub项目内容，判断该项目是否值得推荐，要能清晰说出它和同类工具的差异点\n- 第五题：编写一个统计字数和时长的小工具，要求代码一次就能正常运行，计算结果准确无误\n\n🎯 **自测的实用价值**\n- 新模型发布后，花20分钟用这套固定题目跑一遍测试，比看10个第三方演示更能让自己清楚模型是否适配自身需求\n- 5道题仅能评估模型在个人特定场景下的表现，无法覆盖所有使用场景，后续可以在使用过程中逐步补充新的题目", "time": "2026-11-12 22:15", "link": "https://www.iesdouyin.com/share/video/7707288352009096448/", "adopted": false, "feishu_link": "https://vcnf6h45v8ij.feishu.cn/record/RgUVrWWKle9QuFcq9DYceEc7nY2"}, {"level": "推荐", "title": "Claude", "blogger": "FredTalk", "recommend": "借豆包查官方文档代敲命令装Claude，再接入DeepSeek模型跑通", "summary_md": "💻 **安装配置环节**\n- 不建议新手手动敲安装命令，可借助豆包工作完成安装，要求豆包先查阅克劳德官方文档再执行操作，避免安装旧版本或无效命令\n- Mac端通过豆包操作可全程无需手动输入命令，最终可成功安装2.1.322版本克劳德\n- 克劳德本身是操作外壳，需接入大模型才能运行，国内新手可优先接入DeepSeek模型，无需复杂的官方付费账号注册流程\n- 接入DeepSeek分两步：先在DeepSeek开放平台创建SK开头的API密钥并妥善保存，提前为账户充值避免余额不足报错；再通过豆包将配置写入ZSHRC文件，将所有模型档位指向DeepSeek Flash，配置完成后需新开终端窗口才能生效\n\n🖥️ **终端入门与辅助工具**\n- 终端是通过打字操作电脑的窗口，克劳德需在终端内启动，克劳德在哪个文件夹打开就会在哪个文件夹执行操作\n- 第一个辅助工具Yazi：通过豆包完成安装配置，可通过键盘操作快速定位项目文件夹，全程无需手动输入CD路径命令\n- 第二个辅助工具Tmux：可将终端会话放在后台运行，即使意外关闭终端窗口，正在执行的长任务也不会中断，支持通过命令随时恢复会话\n\n⚙️ **核心基础操作详解**\n- 斜杠命令：输入斜杠可唤起所有内置命令列表，无需手动背诵命令，输入首字母即可快速筛选对应功能\n- 模型切换：通过`/model`命令可查看和切换不同模型档位，接入官方克劳德账号后可使用Opus、Sonnet、Haiku等不同定位的模型\n- 思考强度调节：通过`/effort`唤起滑杆，可在low/medium/high/xhigh/max五个档位调节模型思考时长，任务越复杂选择的档位越高\n- 权限模式：通过shift+tab可切换menu、accept edits、plan、auto四种模式，新手推荐使用默认auto模式，高风险场景可切换menu手动确认每一步操作\n- 实用小技巧：输入感叹号可直接运行终端命令，输入@可快速选中指定文件让克劳德读取，按ESC可随时中断当前生成，连按两次ESC可回退到任意历史对话节点\n- 其他功能：通过`/usage`可查看对话token消耗与使用统计，在设置页可将默认语言修改为中文；通过`/clear`开启新对话，`/resume`恢复历史对话，`/context`可手动压缩对话腾出记忆空间\n\n🛠️ **实战场景演示**\n- 文件夹整理：通过@指定目标文件夹，要求克劳德按类型分类文件、将重复文件移入待删除文件夹而非直接删除，1分钟即可完成杂乱文件夹的规整，还能精准识别内容重复但名称不同的文件\n- 数据分析：上传销售数据表格，通过自然语言指令即可快速完成多维度销售统计，生成可视化分析结论与落地建议，无需手动操作Excel制作透视表\n\n🚀 **进阶玩法技巧**\n- 自定义项目规则：在项目文件夹内创建cloud.md文件，写入自定义使用规则，克劳德每次在该文件夹启动都会自动读取该规则，无需反复重复叮嘱\n- 官方模型高阶应用：接入官方克劳德Opus模型后，可先切换到plan模式让模型先输出执行方案，确认方案无误后再启动执行，避免返工，可快速制作出交互精美的销售数据看板、动态生日祝福网页等高质量内容\n- 高效指令三要素：执行任务时明确指定操作位置、具体需求、交付形式，可大幅提升任务完成准确率\n\n❓ **常见问题排查 mmend": "起号到4万粉的真实踩坑：违规导流被封号、买认证无效", "summary_md": "🎙️ **对谈背景**\n- 本次是柱子哥与3个月从零做到4万粉的财经博主张亭版的播客对谈\n- 4万粉属于起号成功但商业化尚未跑通的尴尬阶段，分享的经验对普通自媒体新手更具参考性\n- 柱子哥的财富自由团1000多人中能从零做到4万粉的不足5人，占比仅千分之一\n\n💣 **第一个账号的踩坑血泪史**\n- 第一个账号从去年11月开始运营，做到今年5月涨至1万多粉丝，前后被平台制裁3次\n- 最初靠碳酸锂产业分析的视频爆了20万播放，涨粉1000多，尝到财经内容的流量甜头\n- 违规拉群、尝试私域导流，大小号双双被封，被禁言一个月掉粉2000多\n- 花2600元购买所谓金融理财师认证试图规避平台规则，最终发现完全没用\n- 账号被平台标记涉及财经敏感话题，后续所有作品播放量始终无法突破5000，半年心血白费\n- 核心教训：绝对不要和平台规则对着干，私域导流变现看似短期能吃饱，但命脉完全捏在平台手中，风险极高\n\n🚀 **第二个账号的快速起号经验**\n- 第一个账号被深度限流后，两人果断决定推倒重来，丝毫不拖泥带水\n- 新账号从6月启动，第一条作品就小爆十几万播放，3个月就做到4万粉，进度远超第一个账号\n- 初期定位做行业科普，避开触碰投资相关的敏感红线，主打半导体、新能源等领域内容\n- 曾尝试做抖音官方支持的会员群变现，但受宏观行情下行影响，流量和转化率双双走低，变现效果不佳\n- 总结出起号期核心准则：1毛钱都不要投流，自然流量能起来就说明内容合格，投流反而容易把受众投偏\n- 网上流传的养号、封面玄学等教程基本都是无效内容，真正活跃的一线博主根本不会出来教别人做自媒体\n\n📈 **账号转型与商业化探索**\n- 发现4万粉的硬核细分财经账号，商业变现能力远不如1万粉的泛AI账号，粉丝量级不等于变现能力\n- 之前的内容过于硬核，直接变成行业研报，只有精准股民才会观看，受众面极窄，品牌方很难找到投放切入点\n- 转型方向从窄众硬核的行业分析，转向门槛更低、受众更广的产业纪实故事内容，做“赛博说书人”\n- 核心认知：AI可以快速检索到冰冷的行业信息，只有加入个人视角、把故事讲得生动有趣，才是知识博主不可替代的核心价值\n- 起号期实操方法：发10条作品，确保推荐流量占比超过80%，基础播放稳定在两三千，10条内没有一条播放破10万就立刻调整方向，不要做无谓的坚持\n\n🤖 **AI工具的实战使用心得**\n- 初期使用豆包整理资料，后续用Gemini的深度搜索功能生成带官方出处的深度报告，大幅降低信息收集成本\n- 曾尝试过Remotion、Codex等多款AI工具，踩过不少坑，最终推荐优先使用Claude，处理视频动效包装的能力远超Codex\n- 核心技巧：和Claude沟通不用写复杂的长提示词，指令越简洁效果越好，模型会自主推导后续步骤\n- 目前的工作流：AI负责信息收集、动效包装，核心剪辑节奏、内容情绪把控依然由人工完成，所谓的AI全自动剪辑本质只是AI自动包装\n- 未来趋势：同等AI工具条件下，最终比拼的是博主本人的表达感染力和内容独特性，建议新手先尝试无包装的纯口播，打磨自身核心能力", "time": "2026-11-11 11:45", "link": "https://www.iesdouyin.com/share/video/7706755092367674666/", "adopted": false, "feishu_link": "https://vcnf6h45v8ij.feishu.cn/record/ZyMgrUcAvekR5icSQmGcqLNpn0f"}, {"level": "推荐", "title": "GitHub小白必装神级项目，会员能停了", "blogger": "FredTalk", "recommend": "5个高星开源项目替代远程控制、传输、PDF等付费会员工具", "summary_md": "💻 **项目整体概况**\n- 本次推荐的5个GitHub开源项目星数最低为5.8万，全部免费开源\n- 覆盖远程控制、跨设备互传、PDF处理、电脑清理、多资源下载五大实用场景\n- 可替代向日葵、迅雷、Adobe Acrobat等多款需要开通会员的付费工具\n\n🔧 **远程控制工具RustDesk**\n- 项目星数近13万，功能覆盖向日葵、TeamViewer的主流使用场景\n- 全平台支持Windows、Mac、安卓、苹果设备，无需复杂配置即可使用\n- 个人使用完全免费，支持自行搭建服务器，数据不经过第三方，企业使用也可保障安全\n- 可远程 致1个字对应1个token，英文大约4个字母对应1个token\n- Token是AI服务的计价单位，API调用时用户输入的内容和模型输出的内容都会分别计费，通常输出内容的单价更高，长文本问答的成本远高于短句提问\n- 大模型单次可容纳的token上限称为上下文窗口，当前对话历史、用户上传的文件内容都需要塞进这个窗口，当内容超出上限时，最早的内容会被挤出，导致模型遗忘早期对话信息，并非模型能力下降\n\n💡 **第五关：提升回答准确率的方法**\n- 用户向AI输入的每一句话都称为提示词，提示词描述越具体，AI给出的答案越精准\n- 大模型存在\"幻觉\"问题，即对不了解的信息也会一本正经地编造内容\n- RAG技术可以解决幻觉问题，将企业内部资料上传到专属知识库，提问时同步把相关资料交给大模型，让模型参照资料输出回答，当前多数企业的AI客服、内部助手都是基于知识库+RAG搭建的\n\n🛠️ **第六关：让AI具备执行能力**\n- 工具调用是指开发者为大模型配置查天气、搜资料、下订单等实用工具，模型根据需求调用对应工具执行操作，再将结果整合输出\n- MCP是2024年底推出的AI通用接口标准，类似AI世界的USB-C接口，工具按照该标准开发后，所有支持MCP的AI都可以直接接入使用，无需重复适配\n- Agent即智能体，是让大模型自主判断任务流程、决定执行顺序，自动完成从查信息到落地操作的全流程，直到任务结束\n- Skill是将固定的业务流程（比如公司出差订酒店的规范要求）写成说明书，Agent执行任务时可以直接参照执行\n\n🏆 **最终Boss关：自主搭建AI应用**\n- 借助AI代码生成工具，即使不会写代码也可以通过自然语言描述需求，让AI自动生成前端页面、后端逻辑并关联数据库\n- API Key必须存放在后端，不能放在前端，因为前端代码所有人都可以查看，放在前端会导致密钥泄露，相当于公开账号权限\n- 将知识库、各类工具接入完成后，把整个应用部署到云服务器上，其他用户可以通过网址直接访问使用，这个过程称为上线\n- 这种仅需自然语言描述需求，代码全部由AI生成的开发模式叫做Web Hold\n- 应用上线后会遇到高并发限流、服务报警、成本飙升、知识库外问题引发幻觉等实际问题，需要结合前面所有环节的知识逐一解决\n\n📌 **核心知识点总结**\n- 从用户输入一句话到AI返回结果的全链路，覆盖了前端、后端、API、大模型、Token、RAG、MCP、Agent、Skill等所有AI领域高频专业术语\n- 后续遇到新的AI术语，可以通过判断它在这条链路的哪一站，以及它是让AI更会想、更会说还是更会做，快速理解其核心作用", "time": "2026-11-08 12:00", "link": "https://www.iesdouyin.com/share/video/7705592129279626506/", "adopted": false, "feishu_link": "https://vcnf6h45v8ij.feishu.cn/record/WMKZr9hh1ennipcYoTscf4vJnJe"}, {"level": "强烈推荐", "title": "AI都这么强了，公司怎么还没变？", "blogger": "清华姜学长", "recommend": "AI提升单任务效率但公司交付周期没缩短，原因是组织协作能力AI尚不具备。", "summary_md": "💡 **普遍现状观察**\n- AI技术发展速度极快，但多数公司的日常工作方式并未出现大幅变化\n- 员工虽已开始使用AI工具提升个人任务效率，但原有会议、审批流程、部门分工均未调整\n- 单任务执行效率借助AI大幅提升，整体项目交付周期却没有对应缩短\n\n🔍 **核心原因分析**\n- 当下衡量AI能力的标准多聚焦于单任务完成度，比如写代码、解数学题、完成单项专业任务\n- 公司高效运转的核心是多人分工协作的组织协调能力，这类能力是传统单任务AI暂不具备的\n- 当前多AI自主分工、协作、交接的技术仍存在诸多待解决的问题\n\n📊 **相关研究佐证**\n- 哈佛商学院研究者分析了一批YC投资的创业公司样本\n- 从创立之初就围绕AI搭建业务的AI native公司，员工规模平均比同类公司小25%，管理层级更扁平\n- 仅高频使用Claude、Cursor等AI工具，无法完全解释这类公司人员规模更小的特点\n- AI native公司从产品设计阶段就将AI融入全业务流程，原本需要人工持续提供的服务，部分可直接由AI产品完成，业务增长时无需按传统模式持续扩招人员\n\n💭 **延伸思考与方向**\n- 不能仅局限于用AI提升个人手头任务的完成速度，更要重新审视原有工作流程的必要性\n- 随着AI Agent多智能体协作技术不断发展，未来会有更多完整工作可交由AI系统全流程完成\n- 无论是创业者还是职场人，使用AI时都可以思考：如果从一开始就有AI参与，当前的工作是否还需要沿用原有组织方式", "time": "2026-11-07 22:06", "link": "https://www.iesdouyin.com/share/video/7705430721460310257/", "adopted": false, "feishu_link": "https://vcnf6h45v8ij.feishu.cn/record/QkbPrWz7veciYrcNRIhcsXarnHd"}, {"level": "推荐", "title": "一集看懂Agent，从聊天到自己找活干", "blogger": "FredTalk", "recommend": "用模型加工具加循环的公式讲清Agent构成，梳理从对话模型到自主执行的演进。", "summary_md": "📐 **Agent核心基础公式**\n- Agent的核心构成公式为：Agent = 模型 + 工具 + 循环\n- 模型是Agent的大脑，负责思考决策\n- 工具是Agent的手，负责执行具体操作，比如读文件、执行命令、打开网页\n- 循环即Agent Loop，是\"思考-执行-查看结果-再思考\"的闭环流程，直到任务完成\n- 包裹在模型外层、负责调配工具、管理循环、记忆和权限的程序被称为Harness\n- 后续每一代Agent的进步，本质都是Harness在这个基础公式上新增能力\n\n🗣️ **第一关：2022年对话模型阶段**\n- 代表产物是ChatGPT这类对话模型\n- 仅具备\"大脑\"能力，没有可直接操作的\"手\"\n- 无法直接访问用户本地项目内容，用户提供什么信息它才能获取什么\n- 实际执行操作的是用户本人，用户既是它的手也是它的循环\n- 这一代产品属于聊天机器人范畴，还不能被称为真正的Agent\n\n💻 **第二关：Codex与Claude阶段**\n- 2023年起推出的代码编辑类Agent\n- 直接接入用户的项目文件夹，可自主读取、修改代码文件\n- 首次将\"手\"和\"循环\"的权限交到AI手中，无需用户手动复制粘贴操作\n- 执行危险操作前会主动向用户申请权限，由Harness管控安全边界\n- 用户从搬运工转变为派活和验收的管理者\n- 存在使用门槛，要求用户掌握终端命令操作，仅面向程序员群体使用\n\n🖥️ **第三关：桌面Agent阶段**\n- 2024年上半年推出的产品，代表包括Claude Cowork、Codex桌面App、国内腾讯Workbody\n- 将原本的终端操作界面替换为可视化普通窗口，无需用户掌握命令行操作\n- Agent可操作的范围从代码文件扩展到电脑上的文档、表格、PPT等各类办公文件\n- 首次将Agent从程序员群体推广到普通上班族用户\n- 仍存在触发限制：必须用户主动打开窗口发起指令，Agent才会启动执行\n\n🤖 **第四关：OpenClaw（龙虾）阶段**\n- 2023年底诞生的开发者个人项目，2024年初爆火\n- 将Agent的入口替换为聊天软件，用户可通过手机远程向本地电脑上的Agent下发指令\n- 新增两大核心能力：写入文件的长期记忆功能，可记住用户习惯与行事规则；心跳机制，可定时自主唤醒查看待办任务\n- 首次实现Agent无需用户主动呼叫，即可自主启动运行\n- 存在明显短板：需要用户自行安装配置，且拥有本地电脑全权限，安全风险极高；依托用户本地设备运行，电脑关机后Agent同步下线\n\n☁️ **第五关：大厂个人Agent阶段**\n- 2024年下半年大厂集中推出相关产品，代表包括马斯克旗下SpaceX AI的RockBot、Meta的Muse\n- 由大厂提供专属云端隔离环境，每个Agent分配独立的云端电脑，与用户本地设备完全隔开\n- 用户本地设备关机后，Agent仍可在云端持续运行，需要用户确认时才主动发起通知\n- 具备复杂场景处理能力：Muse可自主打开浏览器操作无接口的网站完成订机票、填表单等任务；RockBot支持用户演示一遍流程后自主学习，后续定期自动执行\n- 支持同时创建多个不同职能的Bot，分别负责销售、报销等不同工作，还可设置统筹类Bot进行全局管理\n- 彻底解决此前的安装、安全、离线问题，Agent从极客玩具转变为普通人可用的数字员工\n\n👥 **第六关：Super Agent阶段**\n- 由Dipstick开源推出的最新研究原型级Agent\n- 针对多Agent并行场景下用户注意力成为瓶颈的问题，新增一层主管调度架构\n- 顶层设置Rooter角色，仅负责对接用户、接收指令并向下分派任务，用户全程只需和Rooter交互\n- 下层设置多个Worker角色，每个Worker全程跟进单一任务\n- 支持全双工模式：Worker执行耗时任务期间，用户可随时插话修改需求甚至直接叫停，无需等待任务结束\n- 采用存算分离架构：将思考和记录数据存储在云端，执行操作的环境保留在用户本地设备，自动调用所有开机的设备执行任务\n- 外层挂载WatchDog守护进程，定时检查Worker运行状态，及时处理卡住、跑偏的异常任务\n- 触发机制升级：不再仅由用户唤醒，可响应团队协作场景中的事件自主启动，比如群聊中有人随口提到功能故障，无需@任何人，Worker即可自主复现问题、修复代码并提交PR\n\n📌 **核心进化结论**\n- 多年来Agent的核心进步并非单纯模型能力提升，而是人类在流程中的参与度不断降低\n- 用户角色从亲手执行操作，逐步转变为派活验收，最终仅需做出关键决策\n- 快速判断新Agent能力的三个核心问题：它的手能碰到什么资源？它运行在什么环境里？谁来唤醒它启动任务？", "time": "2026-11-07 15:34", "link": "https://www.iesdouyin.com/share/video/7705329659445005603/", "adopted": false, "feishu_link": "https://vcnf6h45v8ij.feishu.cn/record/PDSirnd9PecPudc23m7cMpNNnof"}, {"level": "推荐", "title": "别让AI猜！教你做出自己的第一个Skill", "blogger": "FredTalk", "recommend": "Skill是写给AI的操作手册，先对话做满意再让AI总结成手册的反向制作法。", "summary_md": "📖 **Skill核心定义**\n- Skill本质是写给AI的专属操作手册，以文件夹形式存储，核心文件为skill.md\n- skill.md顶部标注名称与使用场景描述，下方记录具体操作规则\n- AI日常仅识别各Skill的描述，当用户指令匹配对应场景时才会读取完整手册，因此安装上百个Skill也不会出现逻辑混乱的问题\n\n🛠️ **专属Skill实操制作流程**\n- 采用反向制作逻辑：先通过多轮对话完成目标任务直到效果满意，再让AI将整轮对话的操作逻辑总结生成Skill，避免直接让AI生成不符合自身使用习惯的通用标准内容\n- 以制作周报Skill为例的完整步骤：上传工作记录、会议纪要和数据表，先让AI生成基础周报，再逐步提出优化要求：顶部用三句话提炼核心结论、需老板拍板的事项单独列为第二部分并标注原因、影响范围和负责人、下周计划明确负责人与截止日期，后续进一步要求导出带格式的Word文档，设置标题居中、结论放在浅灰底框、计划做成表格、重点数字加粗，针对数字未加粗的问题补充修正指令，最终得到完全符合要求的成品\n- 最后使用skill creator工具将整轮对话的操作逻辑总结生成名为V1REPORT的Skill，所有提出过的要求包括修正细节都会被完整写入skill.md文件\n- 验证效果：新开对话仅发送“帮品牌组写一下这周的周报，导出word给老板”，AI会自动读取对应Skill，不到3分钟就生成完全符合所有格式和内容要求的周报，无需重复提任何指令\n\n💡 **Skill使用实用经验**\n- Skill的描述部分必须明确标注使用场景，最好直接写入用户日常会使用的口语化指令，方便AI快速匹配触发\n- 使用过程中如果发现效果不符合预期，不要仅在单次对话中修改，要直接告知AI将这条修正规则写入对应Skill，后续使用时就不会再出现同类问题\n- 普通大模型人人都可使用，但用户通过多轮对话教会AI的专属操作规则是独属于自己的定制化能力\n\n📎 **配套资源说明**\n- 本期内容的全部资料已整理到FRE专属知识库，感兴趣的用户可以在评论区留言call FRED获取\n- 博主自身已积累24个自制Skill，覆盖周报生成、封面制作等高频场景，部分Skill还可内置参考素材，比如封面制作Skill中存入博主的照片和风格参考，仅用一句话指令就能快速生成符合要求的内容", "time": "2026-11-07 08:44", "link": "https://www.iesdouyin.com/share/video/7705096187812056362/", "adopted": false, "f -文字内容”的顺序表述即可；生视频当前还未实现单句提示生成完整电影，最优方案是先写分镜再逐镜头生成最后剪辑，镜头提示词需额外补充运镜方式和人物动作，提供首帧、尾帧和参考图可保证同一角色在不同镜头中形象统一；AI编程（Vibe Coding）是最被普通人低估的能力，可自主读取、修改文件并运行，报错后自行修复，普通人可用来制作小网页、批量处理文件、整理数据表格，这类可自主完成完整任务的AI就是Agent；设计类AI可通过文字描述生成可交互界面原型，再对接编程工具转化为真实网页\n- AI工具的发展时间线：2022年底进入聊天时代，一问一答，内容需要用户手动搬运；2025年2月克劳德、Codex出现，AI可自主操作电脑完成代码相关全流程任务；2025年底开源OpenCloud普及，AI可后台常驻自动执行定时任务，但部署门槛较高；2026年Agent能力向普通用户开放，多款无需代码基础的办公类Agent工具上线\n- 工具选择的六大评估维度：回答准确性、运行速度、使用成本、上下文长度、可控性、合规性，唯一选择标准是适配自身的实际任务\n\n📈 **普通人AI进阶六步路径**\n- 第一步：基础聊天，用于提问、写文案，是当前大部分人所处的阶段\n- 第二步：固定提示词，沉淀复用好用的提示词，保证输出结果稳定\n- 第三步：拆解流程，将完整工作拆分，筛选出可交给AI完成的环节\n- 第四步：让AI接触本地文件，借助办公类Agent工具批量处理文档、表格\n- 第五步：让AI自主完成复杂全流程任务，无需人工逐步骤搬运内容\n- 第六步：沉淀复用，把成熟的AI工作流程转化为专属技能或小工具，一句话即可调用\n- 阶段判断方法：上周使用AI全是一问一答属于第一步，有反复使用的固定提示词属于第二步，AI已经处理过本地文件至少达到第四步\n- 各阶段行动建议：处于第一步的用户可做练习：将杂乱的真实会议记录按五要素写提示词，让AI生成三段式总结、要点清单、按优先级排序的待办清单；处于第二、三步的用户沉淀优质提示词，挑选每周重复的常规工作拆分出可交给AI的环节；处于第四步的用户可尝试让AI完成整理发票这类真实小事，给AI指定专属文件夹，先让AI说明执行方案再操作，完成后抽查结果；处于第五步的用户每完成一件事就让AI把步骤沉淀为可复用的技能\n- 设备适配：聊天、生图用手机即可，处理文件、让AI自主执行任务需要使用电脑，国内有大量可直接使用的办公类AI工具，优先跑通一件真实小事即可", "time": "2026-11-02 18:30", "link": "https://www.iesdouyin.com/share/video/7703481725631974690/", "adopted": false, "feishu_link": "https://vcnf6h45v8ij.feishu.cn/record/MANwrQXJReI78McfDMwcAlxdnVh"}, {"level": "推荐", "title": "本周AI大事，Claude取消5小时限额！", "blogger": "FredTalk", "recommend": "本周动态：GPT6.1 Tara主打操作电脑且成本为1/9，Claude取消5小时限额。", "summary_md": "🤖 **Open AI相关动态**\n- 发布GPT6.1 Tara，主打帮助用户操作电脑\n- 官方表示完成同等任务的成本仅为GPT5.5的1/9\n- Open AI总裁Greg brookman称该模型操作电脑的速度已经超过本人\n- Code X的PRO版本和企业高级版的用量上限直接翻倍\n\n🔍 **谷歌模型相关动态**\n- 继两周内连发Gemini斯阿岗模型后，本周推出Gemini斯carbon版本\n- 该模型以59分登顶artificial analysis智能榜，漏洞查找测试准确率达到88.2%\n- 暂不对普通用户开放，仅面向网络安全团队分批开放\n- 将TPU送上卫星，首次在太空跑通了解码模型意念，收到的第一条回复是一手牌具\n\n📝 **克劳德相关动态**\n- 将MAX20X改名为Ultra，定价保持不变\n- 取消了Ultra用户原本5小时的使用限额\n- 内部的克劳德研究模型在Chrome、Safari、安卓、Windows和Linux平台中均找到漏洞，还串联出5条可实际运行的攻击链，相关漏洞已全部修复\n\n🍎 **阿里千问相关动态**\n- 宣布千问接入苹果智能Siri，可调用写作工具和视觉智能能力\n- 11月4日上线开发者测试版，12月正式推送\n\n🔬 **科研类AI成果动态**\n- 欧鹏的AI模型本周交出三项科研成果，其中一项证明了困扰数学 5v8ij.feishu.cn/record/XHCprzv04eIUzIc37AXcFAj7nuh"}, {"level": "推荐", "title": "静态细胞看不懂？我做了个会“动”的生物百科PPT！", "blogger": "大师的AI小灶", "recommend": "用AI把3D模型做成带动效的生物课件PPT，附37种模型和提示词步骤", "summary_md": "🎯 **核心背景与福利**\n- 传统静态生物课件难以直观展示细胞等生物结构，动效课件制作对老师来说难度较高\n- 分享完整的动态生物课件制作方法，配套提供高中生物必修所需的全部37种3D模型\n- 相关资源可通过点赞收藏后在评论区自取\n\n📝 **PPT初稿生成步骤**\n- 将神经元3D模型和参考图一同上传给AI工具，搭配详细的页面内容排布提示词，生成基础PPT框架\n- 若想要提升质感，可输入对应提示词将PPT整体切换为深色科学风格，快速提升整体高级感\n\n✨ **丝滑动效制作技巧**\n- 输入指定提示词即可让3D模型在跨页面时生成丝滑运镜动效，动效时长建议设置为1.5~2秒\n- 播放时PPT会自动从整体视角推进到特写视角，完整可视化展示细胞模型，呈现出类似医学3D纪录片的流畅效果\n\n🎨 **高级质感升级方法**\n- 先通过提示词让AI生成统一风格的页面背景图，确认满意后再将背景图制作成循环流动的粒子视频\n- 缓慢流动的粒子背景不会抢夺模型和文字的注意力，能大幅提升课件的高级氛围感\n\n🔧 **拓展应用场景**\n- 这套制作方法不仅适用于神经元模型，还可套用在生物必修1+2的其他3D模型课件制作中\n- 配套的3D模型生成工具还可制作PPT图标、建筑模型等多种素材，丰富各类课件的呈现效果\n\n💡 **制作价值总结**\n- 借助AI工具无需手动逐帧制作动画，仅用简单指令就能让静态生物细胞“动起来”\n- 大幅降低课件制作耗时，让老师可以将更多精力投入到打磨课程讲解内容上\n- 配套的完整文档教程已准备完毕，方便使用者参考学习", "time": "2026-11-01 16:00", "link": "https://www.iesdouyin.com/share/video/7702814252964351232/", "adopted": false, "feishu_link": "https://vcnf6h45v8ij.feishu.cn/record/GZIQreOyKeL3cqcwnJJck9Ifnwg"}, {"level": "推荐", "title": "分享一个好玩的提示词，让AI填补你的书架", "blogger": "清华姜学长", "recommend": "用有记忆的AI agent根据对用户的了解填充空书架照片，生成贴合个人阅读偏好的真实书单", "summary_md": "✨ **玩法核心操作**\n- 先向AI agent发送一张空书架的照片\n- 再向AI发送指定提示词：根据你对我的了解，把这个空书架填满真实的已经出版的书籍\n\n🤖 **AI agent选择要点**\n- 要挑选平时常用、对自己有记忆的AI agent，比如cloud、codes、work body这类工具\n- AI对你的了解程度越高，生成的记录细节就越丰富，选出的书籍也越贴合你的阅读偏好，更像专属于你的真实书架\n\n📝 **实测体验分享**\n- 作者使用codeods进行实测，AI为其填充了AI相关、写作相关、AI影视相关以及哲学类的书籍\n- 生成的书单里大部分书籍作者确实看过，且之前和AI聊过相关内容，体验感十分有趣\n\n⚠️ **注意事项**\n- AI存在编造不存在书籍的可能性，遇到感兴趣的书籍建议额外核对信息\n- 作者已将空书架照片放在评论区，感兴趣的用户可以直接取用尝试", "time": "2026-10-31 22:10", "link": "https://www.iesdouyin.com/share/video/7702834081667489395/", "adopted": false, "feishu_link": "https://vcnf6h45v8ij.feishu.cn/record/XwHnrmFdbe0l6PciwfrcuTytnhf"}, {"level": "推荐", "title": "普通人怎么赚钱", "blogger": "姜胡说", "recommend": "赚钱的两个卡点：羞耻心，以及只走考证攒资历的长队而忽略直线路径", "summary_md": "💡 **第一个卡点：赚钱羞耻心**\n- 很多人一谈钱就觉得不好意思、上不了台面，这种错误认知是阻碍赚钱的首要因素\n- 以袁隆平先生为例，即便他每日仅工作8小时，普通人工作16小时，他的收入比普通人高100倍也是合理的，因为他解决了上亿人吃饭的核心问题\n- 核心认知：只要赚到的每一分钱都是通过为他人、为社会创造价值换来的，这份收入就站得正立得直，不仅不可耻，反而是光荣的\n\n🛤️ **第二个卡点：错误的赚钱路径**\n- 多数人一想到赚钱，第一反应就是考证、攒资历，去排那条所有人都在走的长队，忽略了两点之间直线最短的基本逻辑\n- 学历本质是招聘方无法直接判断能力时的敲门砖，如果你已经有过成功解决问题的实际成果，就不需要再走排队的老路\n- 两种高效赚钱路径：一是把自己曾经帮他人解决过、对方十分感激的问题，直接做成产品售卖；二是对接市面上已经被验证、人们正在购买的成熟商品，无需从零造产品\n- 举例：眉山的橙子成本从6毛降到2毛，过季就会烂在地里，不需要自己种植，只要帮农民把橙子卖出去，既帮农民找到销路，自己也能赚到钱\n\n📈 **第三个卡点：不懂如何做大做强**\n- 2003到2011年做软件公司的经验：不按常规流程写需求说明书、架构设计、详细设计，而是先和用户沟通，找出用户最核心的需求，只做极简的初始模型交付给用户，根据用户反馈反复修改迭代，最终验收前产品已经在用户现场使用了好几个月，项目通过率100%，靠满足真实需求获得用户信任，项目规模越做越大\n- 当下做短视频的经验：不带货不做陪跑，只售卖专栏和书籍，分享经验后收集用户评论里的集中问题，调整内容方向反复拍摄升级，对问题的理解进一步加深后做成付费专栏，再收集反馈迭代优化，最终整理成书，上一本书累计印刷18次，全程没有做营销，产品因为对用户真正有用而自然获得传播\n- 核心逻辑：真正决定学习和成长速度的，不是读了多少书、上了多少年学，而是获取真实反馈的频率，以及拿到反馈之后做出的调整动作，一周都没人使用你的成果，本质上都只是在无效自学\n- 行动指引：立刻写下自己曾经帮别人解决过的一个问题，记录下是谁的问题、对方是如何感谢你的，这就是属于你的第一个可落地产品", "time": "2026-10-31 20:08", "link": "https://www.iesdouyin.com/share/video/7702802684784430372/", "adopted": false, "feishu_link": "https://vcnf6h45v8ij.feishu.cn/record/CjQIrWSDveCwqDc0MOCcOvSfnNe"}, {"level": "推荐", "title": "项飙关于AI恐慌的演讲，我的三层解读", "blogger": "清华姜学长", "recommend": "项飙解读AI恐慌：抽象意义多于真实做事经验，人就会空虚恐慌，应多做完整事务并复盘。", "summary_md": "💬 **第一层：意义与经验的失衡**\n- 人类使用数千年的语言从未被完全摸清运行逻辑，但大众不会因此恐慌，因为有具体场景、对话表情、上下文锚定含义\n- AI输出大量看似有意义的符号内容，速度快却很少伴随用户共同完成事务、见证结果\n- 大众常先接触抽象说法再触碰现实，甚至用大量抽象意义替代真实经验，容易内心空虚产生恐慌\n- 合理调整配比：让“做完事务并复盘”的次数多于“看似读懂内容”的次数，将恐慌转化为提醒信号\n\n📊 **第二层：抽象体系的捕获**\n- AI是人类社会依靠符号、数据、远程规则运转的新阶段，此前经历了书写、印刷、金融化制度正规化的发展过程\n- 思想实验：在上海金融区搭建AI系统远比在亚马逊原始部落容易，前者有大量可抓取的线上抽象数据，后者多是人与人和人与自然的直接感官交互\n- 即便AI叠不好被子、接不准球，也已经摸清现代社会依靠数据、符号运转的核心组织方式\n- 不同行业受AI影响程度不同，依赖现场、手艺、面对面交互的行业，AI渗透路径和金融区完全不同\n\n🏭 **第三层：硅谷跑路主义叙事助推恐慌**\n- 核心逻辑：认为当下常规路径无法解决问题，必须依靠绝对性的革命技术向前跳跃，普通人眼前的具体麻烦往往被排在优先级之外\n- 矛盾行为：一边大力投入AI研发，一边公开宣称AI有不小概率消灭人类，将AI近乎神化，同时主张普通监管无效，必须由头部企业自行管控\n- 这种叙事会转移大众注意力，宏大的恐惧变得廉价，眼前具体的生活难题反而被忽视\n- 硅谷内部并非铁板一块，关于AI风险百分比的说法口径差异很大，无需将这类叙事当作唯一既定事实\n\n💡 **普通人的应对方案**\n- 梳理工作、邻里、亲友等可以共同协作的现实关系，为自己留存一块真实经验的小阵地\n- 恐慌时不要盲目囤积各类“解毒” 909182193/", "adopted": false, "feishu_link": "https://vcnf6h45v8ij.feishu.cn/record/DWJ3rqddcekZZfcZ8QLcCYZhnLd"}, {"level": "推荐", "title": "赚钱要靠两条腿", "blogger": "姜胡说", "recommend": "赚钱是构建价值与传播价值两条腿协同，播放量不等于实际收益，选题可从自身踩坑和用户求助场景挖掘。", "summary_md": "💡 **核心底层逻辑**\n- 赚钱的核心是构建价值与传播价值两条腿协同，而非单纯做两份收入\n- 很多人陷入单条腿困境：做短视频赚不到钱、用AI工具产出大量内容无人问津，本质是构建和传播环节割裂\n- 自媒体的资金成本近乎为零，是普通人低成本启动的绝佳路径\n- 纠正认知误区：播放量只是平台给予的奖励，不等于自身的实际收益\n\n📝 **零成本选题获取渠道**\n- 从自身经历挖掘：自己踩过的坑、取得过的成绩，其他人大概率也会遇到同类问题\n- 从已产生消费的场景挖掘：人们反复花钱的地方，需求已经被真金白银验证，花点钱进入场景观察需求也值得\n- 从用户求助场景挖掘：比如Reddit这类平台，用户主动提出的各类真实诉求都是优质选题来源\n- 无需解决所有问题，只挑选自己有能力解决的需求切入\n\n🔄 **价值迭代闭环流程**\n- 不为拍视频、写文章而创作，视频和文章都是副产品，核心目的是把问题研究透彻\n- 梳理问题的完整逻辑：明确问题是什么、是否值得解决、谁会遇到该问题、在什么场景下遇到、对应的解决方案和底层原理是什么\n- 梳理完成后将内容存入个人知识库，形成专属知识卡片，后续再转化为视频内容发布\n- 发布的视频本质是需求测试而非宣传：收到用户反馈说明是真实需求，无反馈则代表该知识价值较低\n- 借助用户反馈补充不同场景细节，让单一知识从A迭代为A+B+C+D，和过往知识串联后可发现真实的蓝海机会，打造出能为他人提供价值的产品\n- 完整闭环：构建价值→对外传播获取反馈→迭代认知→优化产品→再次传播获取更多反馈，每一轮循环都能迭代产品、积累用户，有价值和用户自然就能获得收益\n\n🎯 **即刻行动建议**\n- 当晚就可以完成的小事：拿出最近自己做出来的一件作品，统计知道它的人数，如果少于10人，当天就对外发布一次，只询问一句“有没有人需要这个”", "time": "2026-10-16 21:24", "link": "https://www.iesdouyin.com/share/video/7697255829568818432/", "adopted": false, "feishu_link": "https://vcnf6h45v8ij.feishu.cn/record/KJdlrdFjUemLcucSxCacQwI8nKv"}, {"level": "强烈推荐", "title": "火爆全球的 AI 个人助理，找豆包就可以了 双十一想买的东西一大堆，又不想每天打开好几个购物软件来回", "blogger": "FredTalk", "recommend": "用豆包设定盯价规则自动比价，发现低于提醒线500元的商品并生成全渠道价格对比图。", "summary_md": "📌 **功能背景**\n- 近期海外AI个人助理相关内容引发大量关注，不少用户开始研究这类工具的使用方法\n- 实际上国内的豆包就可以实现同类实用的个人助理功能，尤其适合双十一等大促期间的购物比价场景\n\n🧪 **单商品盯价实测**\n- 用户首先拿出心仪的饮食露娜ultra进行测试，仅向豆包发送指令：帮忙盯这款商品的价格，出现好价时进行提醒\n- 豆包自动查询全平台行情后，和用户确认规则：当标准版到手价低于3899元时触发提醒，设定每日早上自动查询一次\n- 规则生效后豆包首次查询就发现抖音影视官方旗舰店的国补后价格仅3399元，比设定的提醒线低500元\n- 同时豆包自动生成全渠道价格对比图，清晰标注优惠来源、购买店铺和下单步骤指引\n- 次日自动查询时发现网传某平台2889元的低价，经核验后发现是商家蹭关键词售卖的luna pro，直接排除了虚假低价信息\n\n📦 **多商品批量盯价实测**\n- 用户后续加大使用强度，提交了包含15件商品的采购清单，涵盖硬盘、耳机等数码产品，以及洗发水、抽纸、牛奶、咖啡胶囊等日用洗护商品\n- 用户明确告知所有商品都不急于入手，仅在出现符合要求的好价时再进行提醒，同时标注了每件商品的规格和比价要求\n- 豆包自动生成3个子Agent，将15件商品按数码、洗护、日用三个分类同步并行查询\n- 完成初筛 ishu.cn/record/EG60r2OLZee4AZcyskHcV8rdn3e"}, {"level": "推荐", "title": "分享一个有趣的提示词", "blogger": "晓辉博士", "recommend": "用AI提示词让AI基于聊天记忆画出你的工作画像，帮管理者看清自己。", "summary_md": "🎨 **提示词玩法**\n- 给AI一张空容器（类似饭盒）的图片\n- 发送指令：\"用你知道的关于我的一切，把这个容器的两面都填满\"\n- AI基于历史对话和记忆生成可视化内容\n\n🖼️ **生成结果特点**\n- 内容与用户历史对话高度相关，不同用户结果差异大\n- 有人物形象、电脑设备、食物等具象化呈现\n- 抽象概念（如复杂系统、AI、创新创业）以文字标注形式展现\n- 包含用户基本理念（如表达、连接、信任）和个人元素（如出国旅行护照）\n\n🔍 **实验体验**\n- 作者测试后认为结果准确且丰富\n- 建议用户用自己的AI agent尝试\n- 提示词和图片将贴在评论区供参考", "time": "2026-09-21 23:58", "link": "https://www.iesdouyin.com/share/video/7688018460618048123/", "adopted": false, "feishu_link": "https://vcnf6h45v8ij.feishu.cn/record/D8Ydr8DUsetcSBcJ9RWcW0XSn4e"}, {"level": "推荐", "title": "短视频变现就三件事", "blogger": "姜胡说", "recommend": "短视频变现的核心是利他和表达，而非追求播放量点赞等流量数据。", "summary_md": "🎯 **核心目标导向**\n- 做短视频的本质是变现，而非追求播放量、点赞或粉丝数\n- 类比打球：目标是赢球（变现），而非动作好看（流量数据）\n- 商业逻辑：供给端提供内容，消费端获取价值，通过成交实现闭环\n\n🤝 **第一原则：利他**\n- 核心关注为用户提供真实价值，而非流量数据\n- 构建对用户有用的内容/产品，围绕用户需求设计\n- 拒绝追热点、耍小聪明，长期主义者会越做越好\n- 真正的利他是提供用户需要的东西，而非忽悠式营销\n\n🗣️ **第二原则：表达**\n- 表达的核心是清晰传递价值，而非花言巧语或表演\n- 推荐结构：痛点-机理-解决方案\n- 允许真实瑕疵（如口吃），活人感比完美表演更重要\n- AI的正确用法：帮助梳理要点，而非生成爆款钩子文案\n\n📤 **第三原则：分发**\n- 分发的目标是触达真正需要的用户，而非吸引所有人\n- 黄金三秒直接说明视频价值，过滤非目标用户\n- 了解平台算法是为了更好使用，而非钻营\n- 数据判定标准：点赞=感兴趣，评论=真需求，成交=商业模式成立", "time": "2026-09-21 23:12", "link": "https://www.iesdouyin.com/share/video/7688006587167935782/", "adopted": false, "feishu_link": "https://vcnf6h45v8ij.feishu.cn/record/WRhTrjBUJenwcxc5g5ScP3U3nfc"}, {"level": "强烈推荐", "title": "普通人学AI，四步从零到真正会用", "blogger": "清华姜学长", "recommend": "非技术人学AI四步法：建立能力地图、清晰交代任务、动手实践、复盘迭代。", "summary_md": "🧠 **第一步：建立AI认知地图**\n- 无需先研究技术原理，先理解AI的三种核心能力：语言能力（梳理材料、改文案）、多模态能力（处理图像/音频/视频）、工具调用能力（读文件、执行操作）\n- 了解基础AI概念（大模型LM、智能体Agent、上下文Context），遇到时再补学，无需提前背诵\n- 判断标准：手上的任务能大致对应AI工具，如整理会议记录直接找文件处理工具，无需先学部署Agent\n\n📝 **第二步：学会清晰交代任务**\n- 练习一次对话明确需求，避免模糊指令（如写周报需说明材料、对象、字数、重点）\n- 提供具体要求（如“200字发给主管的周报，重点讲项目进展/问题/计划，不编数据”）\n- 拿到结果后指出具体问题（如“未完成事项不能写交付，改成‘目前进展’”），而非笼统说“重写”\n\n💻 **第三步：用AI完成真实工作**\n- 拿本周实际任务练习（如整理会议纪要：上传脱敏记录，让AI提炼结论、责任人和跟进时间，标注重难点）\n- 检查结果：对照原记录确认是否遗漏关键事项，是否将讨论想法写成确定结论\n- 处理文件可尝试Cloud Code、CodedX等Agent工具，国内可了解Work Body，先拿副本试分类方案\n- 手机端可尝试小龙虾、OpenC Hermes等工具，配置后通过聊天软件安排任务（需部署维护）\n- 整理任务要求为Skill（保存规则、模板、脚本），下次调用无需重复交代\n\n🛠️ **第四步：实战小项目（进阶）**\n- 做小工具/网站（如个人作品网站），先缩小范围（仅展示作品，不先加登录支付）\n- 明确需求：告知网站受众、内容、风格，让AI列方案后做第一版\n- 测试优化：检查作品信息、按钮功能、手机适配，发现问题提供具体操作/错误信息\n- 公开使用需确认访问方式，检查是否泄露隐私\n- 边做边补必要知识，无需先学全编程，以“他人能否顺利使用”为验收标准", "time": "2026-09-21 19:05", "link": "https://www.iesdouyin.com/share/video/7687942973116735729/", "adopted": false, "feishu_link": "https://vcnf6h45v8ij.feishu.cn/record/DNLDrEqFCeaGpock8W2cfZfBnFh"}, {"level": "推荐", "title": "AI来了开发者变多了挣钱机会呢？", "blogger": "晓辉博士", "recommend": "AI降低开发门槛后，非技术者如何抓住长尾需求做小产品变现。", "summary_md": "🤔 **核心讨论背景**\n- 近期一张引发讨论的图：AI到来前独立开发者少、付费用户多；AI后开发者激增、付费用户看似不足\n- 大众初看觉得有道理，但需从多视角分析挣钱机会是否真的减少\n\n💡 **AI提升开发者交付能力**\n- 传统独立开发者交付能力有限，仅能做C端小功能\n- AI放大能力后，可开发复杂软件或To B服务，付费用户层次扩展\n\n🔍 **新需求与长尾市场**\n- AI让无开发能力者成为builder，满足未被关注的长尾需求（如情绪价值、陪伴、宗教类需求）\n- 企业转型/AI应用需求增加，小团队/独立开发者可承接To B交付\n\n💼 **多元化变现渠道**\n- Build in public模式带来咨询/卖课需求（用户希望学习开发方法）\n- 高流量开发者可通过广告商单变现\n- 变现方式从单一产品拓展至课程、广告、To B服务等\n\n🌱 **新需求增长点**\n- 独立开发者自身需求（公司注册、代理记账、法务合规等）\n- 关键：关注执行能力转移后不可替代的人类需求方向\n\n📅 **直播预告**\n- 周一晚上在新可能实验室视频号有公开直播\n- 分享做新可能实验室的想法及近期思考总结", "time": "2026-09-21 00:25", "link": "https://www.iesdouyin.com/share/video/7687654404861889657/", "adopted": false, "feishu_link": "https://vcnf6h45v8ij.feishu.cn/record/NXFTr8a8XelnQ6cUQyzcD7z9nqh"}, {"level": "推荐", "title": "动手吧，改变人生", "blogger": "姜胡说", "recommend": "从只学习到动手做，缺什么学什么，用AI自制工具解决真实问题。", "summary_md": "📚 **个人经历：从\"只学习\"到\"动手做\"的转变**\n- 98-99年开始学习编程，学多种语言、看大量书籍却无人录用，而晚学的同学数月被挖走（月薪8k-1w）\n- 偶然机会接下陌生项目，逼自己\"缺什么学什么\"，成功完成后人生切换为\"动手做真东西\"模式\n\n💡 **动手与创造力的价值**\n- 赚钱本质是创造有价值的东西，缺乏动手能力只能重复劳动\n- 创造力非天生，需在动手实践中锻炼\n- 案例：拆解香港迪士尼设计，为朋友大会重新设计风格，全场拍照认可；用AI自制语音输入法，能识别含糊发音\n\n🚀 **行动建议**\n- 机会不等\"准备好的人\"，只等\"动手的人\"\n- 建议今晚动手做小事：改旧衣、写脚本、拍视频、设计汤品等\n- 批判\"只学不做\"：知识囤积卖不出，思想僵化", "time": "2026-09-20 23:06", "link": "https://www.iesdou const state = { src: 'sub', level: 'all', status: 'all', q: '' };
const listEl = document.getElementById('list');
const notesEl = document.getElementById('notes-list');

function escHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function mdRender(md){
  if (!md) return '';
  if (window.marked) {
    return marked.parse(md, { breaks: true });
  }
  return '<p>' + escHtml(md).replace(/\n/g, '<br>') + '</p>';
}

function subCard(r){
  const tagCls = r.level === '强烈推荐' ? 'strong' : 'rec';
  const adoptedTag = r.adopted ? '<span class="tag adopted">已采用</span>' : '';
  return `<div class="card">
    <div class="head"><span class="tag ${tagCls}">${escHtml(r.level)}</span>${adoptedTag}<h3>${escHtml(r.title)}</h3></div>
    <div class="sub">${escHtml(r.blogger)} · ${escHtml(r.time)}</div>
    ${r.recommend ? `<div class="recommend">${escHtml(r.recommend)}</div>` : ''}
    <div class="summary">${mdRender(r.summary_md)}</div>
    ${r.link ? `<a class="link-btn" href="${escHtml(r.link)}" target="_blank" rel="noopener">看原视频 →</a>` : ''}
    ${r.feishu_link ? `<a class="link-btn" href="${escHtml(r.feishu_link)}" target="_blank" rel="noopener">在飞书打开 →</a>` : ''}
  </div>`;
}

function hotCard(r){
  const tagCls = r.status === '已采用' ? 'adopted' : 'pending';
  return `<div class="card">
    <div class="head"><span class="tag ${tagCls}">${escHtml(r.status)}</span><h3>${escHtml(r.topic)}</h3></div>
    <div class="sub">${escHtml(r.source)} · ${escHtml(r.time)}${r.reason ? ' · ' + escHtml(r.reason) : ''}</div>
    ${r.core ? `<div class="recommend">${escHtml(r.core)}</div>` : ''}
    ${r.angle ? `<div class="summary"><p><strong>切入角度：</strong>${escHtml(r.angle)}</p></div>` : ''}
    ${r.link ? `<a class="link-btn" href="${escHtml(r.link)}" target="_blank" rel="noopener">看原文 →</a>` : ''}
    ${r.feishu_link ? `<a class="link-btn" href="${escHtml(r.feishu_link)}" target="_blank" rel="noopener">在飞书打开 →</a>` : ''}
  </div>`;
}

function render(){
  let html = '';
  if (state.src === 'sub'){
    const q = state.q.toLowerCase();
    const rows = DATA.sub.filter(r =>
      (state.level === 'all' || r.level === state.level) &&
      (!q || (r.title + ' ' + r.blogger).toLowerCase().includes(q))
    );
    html = rows.map(subCard).join('') || '<div class="empty">没有符合条件的条目</div>';
  } else {
    const q = state.q.toLowerCase();
    const rows = DATA.hot.filter(r =>
      (state.status === 'all' || r.status === state.status) &&
      (!q || (r.topic + ' ' + r.source).toLowerCase().includes(q))
    );
    html = rows.map(hotCard).join('') || '<div class="empty">没有符合条件的条目</div>';
  }
  listEl.innerHTML = html;
}

function renderNotes(){
  notesEl.innerHTML = DATA.notes.map(n => `<div class="note">
    <div>${escHtml(n.content)}</div>
    <div class="nt">${escHtml(n.time)}${n.link ? ' · <a href="' + escHtml(n.link) + '" target="_blank" rel="noopener">链接</a>' : ''} · ${escHtml(n.status)}${n.feishu_link ? ' · <a href="' + escHtml(n.feishu_link) + '" target="_blank" rel="noopener">在飞书打开</a>' : ''}</div>
  </div>`).join('') || '<div class="empty">还没有速记</div>';
}

// 分段控件：数据源切换
document.getElementById('src-seg').addEventListener('click', e => {
  const btn = e.target.closest('button'); if (!btn) return;
  state.src = btn.dataset.src;
  document.querySelectorAll('#src-seg button').forEach(b => b.classList.toggle('on', b === btn));
  document.getElementById('level-filters').style.display = state.src === 'sub' ? '' : 'none';
  document.getElementById('status-filters').style.display = state.src === 'hot' ? '' : 'none';
  document.getElementById('search').placeholder = state.src === 'sub' ? '搜博主 / 标题…' : '搜选题 / 来源…';
  render();
});

document.getElementById('level-filters').addEventListener('click', e => {
  const btn = e.target.closest('button'); if (!btn) return;
  state.level = btn.dataset.level;
  document.querySelectorAll('#level-filters .fbtn').forEach(b => b.classList.toggle('on', b === btn));
  render();
});

document.getElementById('status-filters').addEventListener('click', e => {
  const btn = e.target.closest('button'); if (!btn) return;
  state.status = btn.dataset.status;
  document.querySelectorAll('#status-filters .fbtn').forEach(b => b.classList.toggle('on', b === btn));
  render();
});

document.getElementById('search').addEventListener('input', e => {
  state.q = e.target.value.trim();
  render();
});

// 灵感速记提交（Cloudflare Worker 代理，密钥不进浏览器）
document.getElementById('cap-btn').addEventListener('click', async () => {
  const content = document.getElementById('cap-content').value.trim();
  const link = document.getElementById('cap-link').value.trim();
  const okEl = document.getElementById('cap-ok');
  const errEl = document.getElementById('cap-err');
  okEl.style.display = 'none'; errEl.style.display = 'none';
  if (!content){ errEl.textContent = '写一句再存'; errEl.style.display = 'block'; return; }
  const btn = document.getElementById('cap-btn');
  btn.disabled = true; btn.textContent = '存…';
  try {
    const resp = await fetch('/api/capture', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content, link }),
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    okEl.style.display = 'block';
    document.getElementById('cap-content').value = '';
    document.getElementById('cap-link').value = '';
  } catch (err) {
    errEl.textContent = '没存上：' + err.message + '（可以去飞书表里手动补一条）';
    errEl.style.display = 'block';
  } finally {
    btn.disabled = false; btn.textContent = '存下来';
  }
});

render();
renderNotes();
</script>
</body>
</html>
